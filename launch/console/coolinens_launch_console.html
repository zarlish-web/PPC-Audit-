}

* { box-sizing: border-box }

body { background: var(--bg); color: var(--ink); font: 14px/1.55 var(--f-body); }
.wrap { max-width: 1320px; margin: 0 auto; padding-inline: clamp(16px, 3vw, 36px); padding-block: 0 64px }

.status { display: inline-flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--ink-2); background: var(--warn-soft); border: 1px solid color-mix(in srgb, var(--warn) 30%, transparent); padding: 6px 10px; border-radius: var(--r) }
.status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--warn) }

.rail { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line) }

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf = (v, d = 0) => v == null || v === '' || isNaN(v) ? '–' : Number(v).toLocaleString('en-US', {minimumFractionDigits: d, maximumFractionDigits: d});
const usd = (v, d = 2) => v == null || v === '' || isNaN(v) ? '–' : '$' + nf(v, d);
const pct = (v, d = 1) => v == null || v === '' || isNaN(v) ? '–' : nf(v * 100, d) + '%';
const store = { get(k, f) { try { return JSON.parse(localStorage.getItem('clls_' + k)) ?? f } catch (e) { return f } }, set(k, v) { try { localStorage.setItem('clls_' + k, JSON.stringify(v)) } catch (e) {} } };
const objs = t => t.rows.map(r => Object.fromEntries(t.cols.map((c, i) => [c, r[i]])));
const KW = objs(D.main), CAMP = objs(D.campaigns), INV = objs(D.inventory), EXC = objs(D.excluded), COMP = objs(D.competitors);
const BAT = objs(D.batches);
const sum = (a, f) => a.reduce((s, x) => s + (Number(f(x)) || 0), 0);
const bchip = b => `<span class="bnum k${b}">B${b}</span>`;
const objShort = o => String(o || '').replace('Ranking — ', '');
const stockChip = s => !s ? '' : `<span class="chip ${/^OK/.test(s) ? 'c-good' : /^WATCH/.test(s) ? 'c-warn' : 'c-bad'}">${esc(s)}</span>`;

const confChip = s => `<span class="chip ${/^High/.test(s) ? 'c-good' : /^Medium/.test(s) ? 'c-acc' : 'c-neu'}">${esc(s)}</span>`;

const TABS = [['overview','Overview'],['keywords','Keyword strategy'],['campaigns','Campaigns & budgets'],['method','Ranking maths'],['inventory','Inventory'],['competitors','Competitors'],['history','Decolure & Sleephoria'],['excluded','Excluded keywords']];
const R = {};

/* ---------------------------------------------------------------- overview */
R.overview = s => {
  const b = n => BAT.find(x => x.Batch === n) || {};
  const card = (n, title, foot) => { const x = b(n); return `<article class="batch"><header><h3>${title}</h3>${bchip(n)}</header>
    <div class="stats">
      <div class="stat"><span class="lbl">Keywords</span><b>${nf(x.Keywords)}</b></div>
      <div class="stat"><span class="lbl">Campaigns</span><b>${nf(x.Campaigns)}</b></div>
      <div class="stat"><span class="lbl">Clicks / day</span><b>${nf(x['Planned Clicks / Day'], 1)}</b></div>
      <div class="stat"><span class="lbl">Orders / day</span><b>${nf(x['Expected Orders / Day'], 2)}</b></div>
      <div class="stat"><span class="lbl">Spend / day</span><b>${usd(x['Planned Spend / Day ($)'], 0)}</b></div>
      <div class="stat"><span class="lbl">Exp. ACoS</span><b>${pct(x['Expected ACoS'], 0)}</b></div>

  s.innerHTML = `
  <div class="decision"><span class="lbl">Recommendation</span>
    <p><b>Launch Batch 1 on 15 Oct with ${b1.length} keywords in ${hero} single-keyword (Hero) campaigns and ${halo} Halo campaigns, all Exact match, all with a ranking objective.</b>
    Queen is CooLinens' own size and gets the full rank push. King, Full, Twin and Cal King are also Sleephoria's sizes, so they enter capped and move to a full push once the size is assigned to CooLinens.

  <div class="grid g3">
    ${card(1, '15 Oct 2026 · launch', `${hero} Hero + ${halo} Halo campaigns. Queen full push; other sizes capped.`)}

    <div class="panel"><h3>Batch 1 by objective</h3>
      <div class="tw"><table><thead><tr><th>Objective</th><th class="n">Keywords</th><th class="n">Clicks / day</th><th class="n">Orders / day</th><th class="n">Spend / day</th><th class="n">Exp. ACoS</th></tr></thead><tbody>
      ${Object.entries(byObj).map(([o, a]) => { const sp = sum(a, k => k['Planned Spend / Day ($)']), sa = sum(a, k => k['Expected Ad Sales / Day ($)']);
        return `<tr><td>${esc(o)}</td><td class="n">${a.length}</td><td class="n">${nf(sum(a, k => k['Planned Clicks / Day']), 1)}</td><td class="n">${nf(sum(a, k => k['Expected Orders / Day']), 2)}</td><td class="n">${usd(sp, 0)}</td><td class="n">${pct(sp / sa, 0)}</td></tr>`; }).join('')}
      </tbody></table></div>
      <p class="foot-note">Full push = every click the target rank needs, with a Top-of-Search modifier where the ranking ceiling allows. Capped terms are funded to what their rank needs, at least 1 click/day and never above 3.57 (50 clicks in 14 days).</p></div>
    <div class="panel"><h3>Gates and weekly decision rule</h3>
      <ul class="clean small">${D.rules.slice(1, 2).map(([a, b]) => `<li><b>${esc(a)}:</b> ${esc(b)}</li>`).join('')}${D.weekly.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>

    ${b1.filter(k => k['Campaign Objective'] === 'Ranking — Full Push').map(k => `<tr><td class="kw">${esc(k.Keyword)}</td><td class="n">${nf(k['Search Volume / Month (Launch Window)'])}</td><td class="n"><b>#${k['Target Organic Rank (#)']}</b></td><td class="mono">${esc(k['Rank Path (Wk 2 → Wk 4 → Wk 8)'])}</td><td class="n">${nf(k['Clicks / Day Required for Target Rank'], 2)}</td><td class="n">${pct(k['Expected CVR'])}</td><td class="n">${usd(k['Base Bid ($)'])}</td><td class="n">+${pct(k['TOS Modifier (%)'], 0)}</td><td class="n">${usd(k['Effective TOS CPC ($)'])}</td><td class="n">${usd(k['Planned Spend / Day ($)'])}</td><td class="n">${pct(k['Expected ACoS'])}</td></tr>`).join('')}
    </tbody></table></div></div>
  <div class="panel"><h3>Inventory constraints that change the plan</h3><ul class="clean small">${D.constraints.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>`;
};

/* ---------------------------------------------------------------- method */
R.method = s => {
  const sh = objs(D.share), ec = objs(D.econ);
  const fmtIn = (v, f) => typeof v === 'number' ? (/%/.test(f) ? pct(v, 0) : /\$/.test(f) ? usd(v, 0) : nf(v, /0\.00/.test(f) ? 2 : 0)) : esc(v);
  s.innerHTML = `<div class="head"><h2>Ranking maths</h2><p>How every keyword's required clicks, bid, Top-of-Search modifier and budget are calculated. The same inputs drive the workbook's live formulas; change them on its Assumptions tab and the plan recalculates.</p></div>
  <div class="grid g2">
    <div class="panel"><h3>1 · Clicks and orders needed for the target rank</h3><ul class="clean small">
      <li><b>Searches/day</b> = launch-window search volume ÷ 30 (Oct–Jan runs at about 35% of the June peak).</li>
      <li><b>Market clicks/day</b> = searches/day × clicks per search for that query (SQP, all brands).</li>
      <li><b>Click share for the target rank</b>, measured on Sleephoria (same product) — the share of all clicks on a query it actually took at each organic rank. Small shares are normal: every query's clicks are split across ~48–60 page-1 results and 15–20 sponsored slots.</li>
      <li><b>Paid clicks required</b> = market clicks × click share × ${pct(D.inputs.find(x => /Paid share/.test(x[0]))[1], 0)} (the share ads supplied during Sleephoria's launch).</li>
      <li><b>Orders required</b> = paid clicks × expected CVR (Sleephoria's CVR on the term × 0.8 for a new listing). Totals are shown per day and over the 8-week push.</li></ul></div>
    <div class="panel"><h3>2 · Bid, modifier and budget</h3><ul class="clean small">
      <li><b>Max ranking CPC</b> = price × ranking-ceiling ACoS × expected CVR. Ranking ceiling = MIN(80%, 1.5 × break-even).</li>
      <li><b>Base bid</b> = what Sleephoria paid on the same exact term, capped at the max ranking CPC.</li>
      <li><b>Top-of-Search modifier</b> = the largest 25% step that keeps base × (1 + modifier) ≤ max ranking CPC; up to +100% when Sleephoria's CVR is proven on the term (≥ 50 clicks, ≥ 8% CVR), up to +50% when not, 0% for capped and support terms.</li>
      <li><b>Planned clicks</b>: full push = required clicks (at least 1/day); capped = required clicks, at least 1/day, never above 3.57/day; capped long-tail ≤ 0.75/day. Never more than 10% of a query's searches.</li>
      <li><b>Spend</b> = planned clicks × effective CPC. <b>Campaign budget</b> = its keywords' spend × 1.25, minimum $10.</li></ul></div>
  </div>
  <div class="grid g2">
    <div class="panel"><h3>Click share needed by target rank</h3><div class="tw"><table><thead><tr><th>Target rank (≤)</th><th class="n">Click share needed</th><th class="n">Purchase share observed</th><th class="n">Keyword-months</th></tr></thead><tbody>
      ${sh.map(x => `<tr><td>#${x['Target rank (≤)']}</td><td class="n"><b>${pct(x['Click share needed'], 2)}</b></td><td class="n">${pct(x['Purchase share observed'], 2)}</td><td class="n">${x['Keyword-months (n)']}</td></tr>`).join('')}</tbody></table></div>
      <p class="foot-note">Sleephoria SQP click share in months where its monthly median organic rank sat in each band, Oct 2025 → Sep 2026.</p></div>
    <div class="panel"><h3>Economics by size</h3><div class="tw"><table><thead><tr><th>Size</th><th class="n">Price</th><th class="n">Margin / unit</th><th class="n">Break-even ACoS</th><th class="n">Target ACoS</th><th class="n">Ranking ceiling</th></tr></thead><tbody>
      ${ec.map(x => `<tr><td>${x.Size}</td><td class="n">${usd(x.Price)}</td><td class="n">${usd(x['Margin / unit'])}</td><td class="n">${pct(x['Break-even ACoS'])}</td><td class="n">${pct(x['Target ACoS'])}</td><td class="n"><b>${pct(x['Ranking ceiling ACoS'])}</b></td></tr>`).join('')}</tbody></table></div>
      <p class="foot-note">Margin = price − COGS − FBA fee − 15% referral − $3.50 allowance. No-size keywords use Queen (they advertise Queen Graphite).</p></div>
  </div>
  <div class="panel"><h3>Inputs</h3><div class="tw"><table><thead><tr><th>Input</th><th class="n">Value</th><th>Source / reason</th></tr></thead><tbody>
    ${D.inputs.map(([a, v, f, n]) => `<tr><td>${esc(a)}</td><td class="n"><b>${fmtIn(v, f)}</b></td><td class="small muted">${esc(n)}</td></tr>`).join('')}</tbody></table></div></div>
  <div class="panel"><h3>How keywords were assigned to a batch</h3><ul class="clean small">${D.rules.map(([a, b]) => `<li><b>${esc(a)}:</b> ${esc(b)}</li>`).join('')}</ul></div>`;
};

    <p>${esc(c.Material || '')}</p>
    <div class="row2"><span><b class="num">${esc(String(c['Queen / ref price'] || '').slice(0, 60))}</b></span><span>${c.Rating ? '★ ' + esc(c.Rating) : ''} ${c.Reviews ? '· ' + esc(c.Reviews) + ' reviews' : ''}</span></div>
    ${c['ASINsight 7-day traffic'] ? `<div class="row2"><span>Traffic/wk ${nf(c['ASINsight 7-day traffic'])}</span><span>Ad share ${typeof c['Ad share of traffic'] === 'number' ? pct(c['Ad share of traffic'], 0) : '–'}</span><span>Organic top-10 kw ${nf(c['Organic top-10 keywords'])}</span>${c['"cooling sheets" organic / SP rank'] ? `<span>"cooling sheets" ${esc(c['"cooling sheets" organic / SP rank'])}</span>` : ''}</div>` : ''}
    ${c.Strengths && c.Strengths !== '—' ? `<p><span class="lbl">Strengths</span><br>${esc(c.Strengths)}</p>` : ''}
    ${c.Weaknesses && c.Weaknesses !== '—' ? `<p><span class="lbl">Weaknesses</span><br>${esc(c.Weaknesses)}</p>` : ''}
    ${c['How they compare with CooLinens'] ? `<p><span class="lbl">vs CooLinens</span><br>${esc(c['How they compare with CooLinens'])}</p>` : ''}
    ${c['Main keywords (best organic)'] ? `<details><summary>Keywords</summary><p class="small">Best organic: ${esc(c['Main keywords (best organic)'])}</p><p class="small">Most advertised: ${esc(c['PPC presence (most advertised)'])}</p></details>` : ''}
  </article>`).join('')}</div>`;
};

/* ---------------------------------------------------------------- history */
function barChart(rows, xKey, yKey, extra, title) {
  const W = 1180, H = 300, L = 56, Rr = 12, T = 14, B = 34;
  const vals = rows.map(r => Number(r[yKey]) || 0), mx = Math.max(...vals) || 1;
  const step = Math.pow(10, Math.floor(Math.log10(mx))) * (mx / Math.pow(10, Math.floor(Math.log10(mx))) > 5 ? 2 : mx / Math.pow(10, Math.floor(Math.log10(mx))) > 2 ? 1 : 0.5);
  const top = Math.ceil(mx / step) * step, ticks = []; for (let v = 0; v <= top + 1e-9; v += step) ticks.push(v);
  const bw = (W - L - Rr) / rows.length, y = v => T + (H - T - B) * (1 - v / top);
  const fmtK = v => v >= 1000 ? '$' + nf(v / 1000, 0) + 'k' : '$' + nf(v);
  const bars = rows.map((r, i) => { const v = Number(r[yKey]) || 0, x = L + i * bw + 1, w = Math.max(2, bw - 2), h = (H - B) - y(v);
    const rr = Math.min(4, w / 2, h);
    const d = h <= 0 ? '' : `M${x},${H - B} V${y(v) + rr} Q${x},${y(v)} ${x + rr},${y(v)} H${x + w - rr} Q${x + w},${y(v)} ${x + w},${y(v) + rr} V${H - B} Z`;
    return `<path d="${d}" fill="var(--chart)"/><rect class="hit" x="${L + i * bw}" y="${T}" width="${bw}" height="${H - T - B}" fill="transparent" data-i="${i}"/>`; }).join('');
  const xl = rows.map((r, i) => i % 3 === 0 ? `<text x="${L + i * bw + bw / 2}" y="${H - B + 16}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${esc(String(r[xKey]).slice(2))}</text>` : '').join('');
  const yl = ticks.map(v => `<line x1="${L}" x2="${W - Rr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/><text x="${L - 6}" y="${y(v) + 3.5}" text-anchor="end" font-size="10.5" fill="var(--muted)">${fmtK(v)}</text>`).join('');
  return { html: `<div class="chartbox"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}">${yl}${bars}<line x1="${L}" x2="${W - Rr}" y1="${H - B}" y2="${H - B}" stroke="var(--line)"/>${xl}</svg><div class="tip"></div></div>`,
    wire(box) { const tip = $('.tip', box), svg = $('svg', box);
      box.querySelectorAll('.hit').forEach(h => { h.onmouseenter = () => { const r = rows[h.dataset.i], bb = svg.getBoundingClientRect(), hb = h.getBoundingClientRect();
        tip.innerHTML = extra(r); tip.style.left = (hb.left - bb.left + hb.width / 2) + 'px'; tip.style.top = (y(Number(r[yKey]) || 0) / H * bb.height) + 'px'; tip.style.opacity = 1; };
        h.onmouseleave = () => tip.style.opacity = 0; }); } };
}
function tbl(t, spec) {
  const rows = objs(t);
  return `<div class="tw"><table><thead><tr>${spec.map(([c, l, f]) => `<th class="${f && f !== 't' ? 'n' : ''}">${l}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${spec.map(([c, l, f]) => {
    const v = r[c]; const o = f === '$' ? usd(v, 0) : f === '$2' ? usd(v) : f === '%f' ? pct(v) : f === '%p' ? (v == null ? '–' : nf(v, 1) + '%') : f === '#' ? nf(v) : f === '#1' ? nf(v, 1) : f === '#2' ? nf(v, 2) : esc(v ?? '–');
    return `<td class="${f && f !== 't' ? 'n' : ''}${f === 't' ? ' small' : ''}">${o}</td>`; }).join('')}</tr>`).join('')}</tbody></table></div>`;
}
R.history = s => {
  let which = store.get('hist', 'sl');
  s.innerHTML = `<div class="head"><h2>Decolure and Sleephoria history</h2><p>The evidence behind every keyword decision. Sleephoria is the same product, COGS, colours and price as CooLinens, so its history carries the most weight. Decolure is the ~$38 microfiber tier with the longer history.</p></div>
  <div class="controls"><div class="seg" role="group" aria-label="Product" id="hx"><button data-h="sl" aria-pressed="${which === 'sl'}">Sleephoria (same product)</button><button data-h="dc" aria-pressed="${which === 'dc'}">Decolure ($38 tier)</button></div></div>
  <div id="hb" class="grid"></div>`;
  const draw = () => {
    const h = D[which], sl = which === 'sl';
    const mon = objs(h.monthly), sk = sl ? 'sales' : 'total_sales', spk = sl ? 'ad_spend' : 'ppc_spend';
    const ch = barChart(mon, 'month', sk, r => `<b>${esc(r.month)}</b><br>Sales ${usd(r[sk], 0)}<br>Ad spend ${usd(r[spk], 0)}${r[sk] ? ' · TACoS ' + nf(100 * r[spk] / r[sk], 1) + '%' : ''}<br>Net profit ${usd(r.net_profit, 0)}`, 'Monthly sales');
    $('#hb', s).innerHTML = `
    <div class="panel"><h3>What ${sl ? 'Sleephoria' : 'Decolure'} tells us for CooLinens</h3><ul class="clean small">${h.learn.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>
    <div class="panel"><div class="kv">${h.summary.map(([a, v, f]) => `<div><span class="lbl">${esc(a)}</span><b>${typeof v === 'number' ? (/%/.test(f) ? pct(v) : /\$/.test(f) ? usd(v, /0\.00/.test(f) ? 2 : 0) : nf(v)) : esc(v)}</b></div>`).join('')}</div></div>
    <div class="panel"><h3>Monthly sales, ${esc(mon[0].month)} → ${esc(mon[mon.length - 1].month)}</h3><p class="small muted">Sellerboard total sales by month. Hover a bar for ad spend, TACoS and net profit; the full monthly table is below.</p>${ch.html}
      <details><summary>Monthly table</summary>${tbl(h.monthly, sl ? [['month','Month','t'],['sales','Sales','$'],['units','Units','#'],['sessions','Sessions','#'],['unit_session_pct','Unit session %','%p'],['ad_spend','Ad spend','$'],['tacos_pct','TACoS %','%p'],['ppc_acos_pct','PPC ACoS %','%p'],['ppc_cpc','CPC','$2'],['ppc_cvr_pct','PPC CVR %','%p'],['net_profit','Net profit','$']]
        : [['month','Month','t'],['total_sales','Sales','$'],['units','Units','#'],['sessions','Sessions','#'],['unit_session_pct','Unit session %','%p'],['ppc_spend','PPC spend','$'],['tacos_ppc_pct','TACoS %','%p'],['ppc_acos_pct','PPC ACoS %','%p'],['ppc_cpc','CPC','$2'],['ppc_cvr_pct','PPC CVR %','%p'],['net_profit','Net profit','$']])}</details></div>
    <div class="panel"><h3>${sl ? 'Period comparison' : 'Same period year on year'}</h3>${sl ? tbl(h.periods, [['period','Period','t'],['spend','Spend','$'],['ad_sales','Ad sales','$'],['acos','ACoS %','%p'],['total_sales','Total sales','$'],['tacos','TACoS %','%p'],['cpc','CPC','$2'],['cvr','CVR %','%p'],['orders_per_day','Orders/day','#1']])
      : tbl(h.periods, [['window','Window','t'],['spend','Spend','$'],['ad_sales','Ad sales','$'],['acos_pct','ACoS %','%p'],['tacos_pct','TACoS %','%p'],['cpc','CPC','$2'],['cvr_pct','CVR %','%p'],['total_sales','Total sales','$'],['sessions','Sessions','#'],['net_profit','Net profit','$']])}</div>
    ${sl ? `<div class="panel"><h3>Launch rank entry, Oct 2025 — what it cost to reach the top 10</h3>${tbl(h.entry, [['keyword','Keyword','t'],['first_top20','First top 20','t'],['first_top10','First top 10','t'],['days_from_ad_start_to_top10','Days to top 10','#'],['oct25_spend_per_day','Spend/day','$2'],['oct25_clicks_per_day','Clicks/day','#1'],['oct25_orders_per_day','Orders/day','#2'],['oct25_acos','ACoS %','%p']])}</div>`
      : `<div class="panel"><h3>Organic rank, top 15 keywords — monthly median (NR = unranked)</h3>${tbl(h.ranks, h.ranks.cols.map((c, i) => [c, i ? c.slice(2) : 'Keyword', 't']))}</div>`}
    <div class="grid g2">
      <div class="panel"><h3>Size performance</h3>${tbl(h.size, [['size','Size','t'],['window','Window','t'],['units','Units','#'],['share_units_pct','Share %','%p'],['sales','Sales','$'],['cvr_pct','CVR %','%p'],['np_per_unit','NP / unit','$2'],['ad_share_pct','Ad share %','%p']])}</div>
      <div class="panel"><h3>Match type (full PPC history)</h3>${tbl(h.match, [[h.match.cols[0], 'Match type', 't'],['spend','Spend','$'],['sales','Sales','$'],['orders','Orders','#'],['clicks','Clicks','#'],['ACoS','ACoS','%f'],['CVR','CVR','%f'],['CPC','CPC','$2']])}</div>
    </div>
    <div class="panel"><h3>Major rises and declines — and why</h3>${sl ? tbl(h.causes, [['period','Period','t'],['direction','Direction','t'],['evidence','Evidence','t'],['cause','Cause','t'],['confidence','Confidence','t']])
      : tbl(h.causes, [['date_or_week','Date','t'],['direction','Direction','t'],['magnitude','Magnitude','t'],['likely_cause','Likely cause','t'],['confidence','Confidence','t']])}</div>`;
    ch.wire($('#hb .chartbox', s));
  };
  s.querySelectorAll('#hx button').forEach(bt => bt.onclick = () => { which = bt.dataset.h; store.set('hist', which); s.querySelectorAll('#hx button').forEach(x => x.setAttribute('aria-pressed', x === bt)); draw(); });
  draw();
};

/* ---------------------------------------------------------------- excluded */
R.excluded = s => {
  const kinds = [...new Set(EXC.map(e => e['Exclusion type']))];
  s.innerHTML = `<div class="head"><h2>Excluded keywords</h2><p>${nf(EXC.length)} keywords were considered and kept out of every batch, each with its reason: fails the product check (wrong material, fitted-only, condition-led, gift lists), Spanish, the same product already failed on it, or not enough evidence or demand. A high search volume alone never qualifies a keyword.</p></div>
  <div class="controls"><label>Reason type<select id="xk"><option value="">All</option>${kinds.map(k => `<option>${esc(k)}</option>`).join('')}</select></label><label>Search<input type="search" id="xq" placeholder="e.g. bamboo"></label><span class="count" id="xc"></span></div>
  <div class="tw"><table><thead><tr><th>Keyword</th><th>Reason type</th><th class="n">SV / mo (launch)</th><th class="n">Relevance</th><th>Confidence</th><th>Reason</th></tr></thead><tbody id="xb"></tbody></table></div>
  <div class="pager" id="xp"></div>`;
  let page = 0;
  const draw = () => { const k = $('#xk', s).value, q = $('#xq', s).value.trim().toLowerCase();
    const a = EXC.filter(e => (!k || e['Exclusion type'] === k) && (!q || String(e.Keyword).includes(q))), per = 100, pages = Math.max(1, Math.ceil(a.length / per)); page = Math.min(page, pages - 1);
    $('#xc', s).textContent = `${nf(a.length)} keywords`;
    $('#xb', s).innerHTML = a.slice(page * per, page * per + per).map(e => `<tr><td class="kw">${esc(e.Keyword)}</td><td class="obj">${esc(e['Exclusion type'])}</td><td class="n">${nf(e['SV / mo (launch window)'])}</td><td class="n">${pct(e['Relevance %'], 0)}</td><td>${esc(e.Confidence || '')}</td><td class="small">${esc(e.Reason)}</td></tr>`).join('');
    $('#xp', s).innerHTML = `<button class="btn" id="xpp" ${page ? '' : 'disabled'}>Previous</button><span>Page ${page + 1} of ${pages}</span><button class="btn" id="xpn" ${page < pages - 1 ? '' : 'disabled'}>Next</button>`;
    $('#xpp', s).onclick = () => { page--; draw(); }; $('#xpn', s).onclick = () => { page++; draw(); }; };
  $('#xk', s).onchange = () => { page = 0; draw(); }; $('#xq', s).oninput = () => { page = 0; draw(); };
  draw();
};

/* ---------------------------------------------------------------- shell */
const main = $('#main'), rail = $('#rail');
rail.innerHTML = TABS.map(([id, l]) => `<button role="tab" id="t-${id}" data-t="${id}" aria-selected="false">${l}</button>`).join('');
main.innerHTML = TABS.map(([id]) => `<section class="tab" id="${id}" role="tabpanel" aria-labelledby="t-${id}" hidden></section>`).join('');
const done = new Set();
function show(id) {
  if (!R[id]) id = 'overview';
  TABS.forEach(([t]) => { $('#' + t).hidden = t !== id; $('#t-' + t).setAttribute('aria-selected', t === id); });
  if (!done.has(id)) { R[id]($('#' + id)); done.add(id); }
  store.set('tab', id);
}
rail.onclick = e => { const b = e.target.closest('button[data-t]'); if (b) { history.replaceState(null, '', '#' + b.dataset.t); show(b.dataset.t); } };
window.addEventListener('hashchange', () => show(location.hash.slice(1)));
show(location.hash.slice(1) || store.get('tab', 'overview'));
</script>
