<title>BFCM 2026 Competitor Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky filter rail, our-product panel, KPI strip, competitor cards / table; a side sheet holds each competitor's full profile. Palette: indigo ink, sateen teal accent, linen neutrals. */
:root{
  --bg:#f5f7f9; --panel:#ffffff; --ink:#18223a; --muted:#5b6880; --line:#dde2ea; --accent:#0f6f6b; --accent-ink:#ffffff; --accent-soft:#e1f1ef;
  --good:#1f7a3d; --good-bg:#e3f4e8; --warn:#8f5600; --warn-bg:#fdf0d8; --bad:#a3252b; --bad-bg:#fbe5e6; --deal:#6b3fa0; --deal-bg:#efe8f7; --chip:#eef1f6;
  --shadow:0 12px 40px rgba(16,28,44,.18);
  --body:"Comfortaa","IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; --mono:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10151f; --panel:#171e2b; --ink:#e7ebf3; --muted:#9aa6ba; --line:#2a3445; --accent:#4fc1b9; --accent-ink:#0d1a1a; --accent-soft:#163633;
  --good:#6fd58f; --good-bg:#163322; --warn:#f0b65a; --warn-bg:#3a2b12; --bad:#f08a8f; --bad-bg:#3a1a1d; --deal:#c7a7ef; --deal-bg:#2a2140; --chip:#222b3a;
  --shadow:0 12px 40px rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151f; --panel:#171e2b; --ink:#e7ebf3; --muted:#9aa6ba; --line:#2a3445; --accent:#4fc1b9; --accent-ink:#0d1a1a; --accent-soft:#163633;
  --good:#6fd58f; --good-bg:#163322; --warn:#f0b65a; --warn-bg:#3a2b12; --bad:#f08a8f; --bad-bg:#3a1a1d; --deal:#c7a7ef; --deal-bg:#2a2140; --chip:#222b3a;
  --shadow:0 12px 40px rgba(0,0,0,.55); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums}
a{color:var(--accent)}
.wrap{max-width:1440px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
header.top{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:baseline;justify-content:space-between;padding-block:20px 8px}
h1{font-weight:700;font-size:clamp(22px,3vw,28px);margin:0;letter-spacing:-.015em;text-wrap:balance}
.sub{color:var(--muted);font-size:12.5px}
.filters{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line);
  display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.filters label{display:flex;flex-direction:column;gap:3px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;min-width:0}
select,input[type=search]{font:inherit;font-size:13px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 8px;width:100%;min-width:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ours{display:grid;grid-template-columns:200px minmax(0,1fr);gap:20px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;margin-top:16px}
@media (max-width:720px){.ours{grid-template-columns:1fr}}
.imgbox{aspect-ratio:1/1;width:100%;max-width:100%;border-radius:8px;background:var(--chip);display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid var(--line)}
.imgbox img{width:100%;height:100%;object-fit:contain;background:#fff}
.imgbox.soon{position:relative}
.imgbox.soon .cap{position:absolute;left:0;right:0;bottom:3px;text-align:center;font-size:10px;line-height:1.2;color:var(--muted)}
.imgbox.soon .cap.xm{left:auto;right:3px;bottom:3px;font-size:9px;background:rgba(255,255,255,.9);padding:1px 5px;border-radius:4px}
.imgbox.soon .cap a{background:rgba(255,255,255,.9);padding:1px 5px;border-radius:4px}
.imgbox .pending{font-size:11px;color:var(--muted);text-align:center;padding:8px;line-height:1.35}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:600}
.ours h2{font-size:20px;font-weight:600;margin:2px 0 6px;line-height:1.25;text-wrap:balance}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px 18px;margin-top:12px}
.fact .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:500}
.fact .v{font-family:var(--mono);font-size:14px;font-weight:500;overflow-wrap:anywhere}
.stk{font-size:11px}
.neg{color:var(--bad)}
.stk.bad{color:var(--bad);font-weight:600}
.stk.warn{color:var(--warn)}
.chip.ok{background:var(--good-bg);color:var(--good)}
td.small{font-size:11px;line-height:1.35}
p.note{font-size:12px;color:var(--muted);margin:6px 0}
.owner{font-size:13px;color:var(--muted);margin-top:4px}
.owner b{color:var(--ink);font-weight:600}
h3.grp-h{font-size:14px;font-weight:700;margin:22px 0 4px;padding-bottom:6px;border-bottom:1px solid var(--line)}
h3.grp-h span{font-weight:400;color:var(--muted);margin-left:6px}
ul.notes{margin:6px 0 0;padding-left:18px;font-size:13px;line-height:1.5}
ul.notes li{margin:4px 0}
ul.notes .src{color:var(--muted);font-size:11.5px}
.mkt-tabs{display:flex;gap:6px;margin:14px 0 4px;border-bottom:1px solid var(--line)}
.mkt-tabs button{font:inherit;font-weight:600;padding:9px 16px;border:1px solid var(--line);border-bottom:none;border-radius:8px 8px 0 0;background:var(--chip);color:var(--muted);cursor:pointer;margin-bottom:-1px}
.mkt-tabs button span{font-weight:400;font-size:12px;margin-left:4px}
.mkt-tabs button[aria-selected="true"]{background:var(--panel);color:var(--ink);border-color:var(--line)}
.fact.wide{grid-column:span 2}
.fact .s{font-size:11.5px;color:var(--muted)}
.chipset{margin-top:14px}
.chipset .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:500;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
button.pick{font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:3px 10px;cursor:pointer;white-space:nowrap}
button.pick .n{color:var(--muted);font-size:11.5px;margin-left:4px}
button.pick[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.pick[aria-pressed="true"] .n{color:inherit}
.vars{display:flex;gap:8px;overflow-x:auto;padding-block:12px 4px;margin-top:6px}
.var{flex:0 0 96px;font-size:11px;color:var(--muted)}
.var .imgbox{width:96px}
.var b{color:var(--ink);font-weight:600;display:block;font-size:11px;margin-top:4px}
.var .pr{font-family:var(--mono);color:var(--ink);font-weight:500}
.var a{font-family:var(--mono);font-size:10.5px}
details.more{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
details.more summary{cursor:pointer;font-weight:600;font-size:13px}
.rec{display:grid;grid-template-columns:170px minmax(0,1fr);gap:4px 14px;font-size:13px;margin-top:10px}
.rec .k{color:var(--muted);font-weight:500}
@media (max-width:720px){.rec{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.kpi .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:500}
.kpi .v{font-size:22px;font-weight:700;letter-spacing:-.01em}
.kpi .s{font-size:11.5px;color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-top:22px}
.bar h3{font-size:17px;font-weight:600;margin:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{font:inherit;font-size:12.5px;background:var(--panel);color:var(--ink);border:0;padding:6px 12px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0;cursor:pointer;text-align:left;font:inherit;color:inherit}
.card > .imgbox{aspect-ratio:4/3;max-height:200px}
.card .head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.brand{font-weight:600;font-size:14px}
.title{font-size:12px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.9em}
.chip{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--chip);color:var(--muted);white-space:nowrap}
.chip.asp{background:var(--accent-soft);color:var(--accent)} .chip.good{background:var(--good-bg);color:var(--good)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.deal{background:var(--deal-bg);color:var(--deal)}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 8px}
.nums .k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.nums .v{font-family:var(--mono);font-size:13px}
.strat{font-size:11.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px}
.strat b{color:var(--ink);font-weight:600}
.asin{font-family:var(--mono);font-size:11px;color:var(--muted)}
.open{font-size:12px;font-weight:600;color:var(--accent);margin-top:auto}
.tablewrap{overflow-x:auto;margin-top:12px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--panel);font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
td.num,th.num{font-family:var(--mono);text-align:right}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--accent-soft)}
td .thumb{width:44px;height:44px}
.empty{padding:40px;text-align:center;color:var(--muted)}
section.checks{margin-top:28px}
section.checks details{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
section.checks summary{cursor:pointer;font-weight:600;font-size:15px}
section.checks td{white-space:normal;vertical-align:top}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}.card:hover{border-color:var(--accent)}}

/* side sheet: one competitor's full profile */
.scrim{position:fixed;inset:0;background:rgba(10,16,24,.38);z-index:40}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(780px,100%);background:var(--panel);z-index:41;box-shadow:var(--shadow);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.sheet-h{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:14px;padding:16px;border-bottom:1px solid var(--line)}
.sheet-h h2{font-size:18px;font-weight:600;margin:2px 0 2px}
.sheet-b{overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:18px}
.x{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;width:34px;height:34px;cursor:pointer;font-size:18px;line-height:1}
.grp h3{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));border:1px solid var(--line);border-radius:8px;overflow:hidden}
.kv>div{padding:9px 11px;min-width:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0}
.kv .k{font-size:11.5px;color:var(--muted)}
.kv .v{font-family:var(--mono);font-size:14px;font-weight:500;overflow-wrap:anywhere}
.kv .s{font-size:11.5px;color:var(--muted)}
@media (max-width:720px){.sheet-h{grid-template-columns:72px minmax(0,1fr) auto}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">BFCM 2026 · competitor research</div>
      <h1>BFCM 2026 Competitor Tracker</h1>
      <div class="owner">Owner: <b>Shayan Rana</b> · Prepared for <b>Erik Fisher</b> &amp; <b>Joseph Fisher</b></div>
    </div>
    <div class="sub" id="builtline"></div>
  </header>

  <section class="checks" style="margin-top:4px" id="guide"></section>
  <nav class="mkt-tabs" role="tablist" aria-label="Marketplace">
    <button type="button" role="tab" data-mkt="US" aria-selected="true">United States <span>Amazon.com</span></button>
    <button type="button" role="tab" data-mkt="CA" aria-selected="false">Canada <span>Amazon.ca</span></button>
  </nav>
  <section class="filters" aria-label="Filters">
    <label for="f-product">Product<select id="f-product"></select></label>
    <select id="f-mkt" hidden aria-hidden="true"><option value="US">US</option><option value="CA">Canada</option></select>
    <label for="f-cls">Competitor type<select id="f-cls"><option value="">All types</option><option>Direct</option><option>Alternative material</option><option>Material not verified</option><option>Different product type</option></select></label>
    <label for="f-brand">Competitor brand<select id="f-brand"></select></label>
    <label for="f-tier">Tier<select id="f-tier"><option value="">All tiers</option><option>Aspirational</option><option>Beatable</option><option>Poor</option><option>Untiered</option></select></label>
    <label for="f-deal">BFCM 2025 deal<select id="f-deal"><option value="">Any</option><option>Lightning Deal</option><option>Prime Exclusive Discount</option><option>Price cut only</option><option>Coupon only</option><option>None</option><option>Not live in 2025</option></select></label>
    <label for="f-str">Strikethrough on page<select id="f-str"><option value="">Any</option><option value="Y">Shown</option><option value="N">Not shown</option></select></label>
    <label for="f-pos">Price vs ours<select id="f-pos"><option value="">Any</option><option value="below">Below our price</option><option value="above">At or above our price</option></select></label>
    <label for="f-q">Search<input id="f-q" type="search" placeholder="Brand, title, ASIN, size or colour"></label>
    <label for="f-sort">Sort<select id="f-sort"><option value="wk">Est. weekly units</option><option value="rev">Est. monthly revenue</option><option value="price">Price, low to high</option><option value="bsr">Best Seller Rank</option><option value="reviews">Reviews</option><option value="lose">Keywords we lose</option><option value="tier">Tier</option></select></label>
  </section>

  <section class="ours" id="ours" aria-live="polite"></section>
  <section class="kpis" id="kpis"></section>

  <div class="bar">
    <h3 id="count">Competitors</h3>
    <div class="seg" role="group" aria-label="View">
      <button type="button" id="v-cards" aria-pressed="true">Cards</button><button type="button" id="v-table" aria-pressed="false">Table</button>
    </div>
  </div>
  <section id="list"></section>

  <section class="checks" id="checks"></section>
</div>
<div id="sheet-root"></div>

<script>
const D = /*__DATA__*/null;
const IMG = window.IMG || {};
const $ = s => document.querySelector(s);
const isNum = v => typeof v === "number" && isFinite(v);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cur = m => m === "CA" ? "C$" : "$";
const fmt$ = (v, m) => isNum(v) ? cur(m) + v.toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2}) : "—";
const fmt0$ = (v, m) => isNum(v) ? cur(m) + Math.round(v).toLocaleString("en-US") : "—";
const fmtN = v => isNum(v) ? Math.round(v).toLocaleString("en-US") : "—";
const fmtP = (v, d = 0) => isNum(v) ? (v * 100).toFixed(d) + "%" : "—";
const fmtX = v => isNum(v) ? v.toFixed(2) + "x" : "—";
const amz = (a, m) => a ? `https://www.amazon.${m === "CA" ? "ca" : "com"}/dp/${a}` : null;
const lnk = (a, m) => a ? `<a href="${amz(a, m)}" target="_blank" rel="noopener">${esc(a)}</a>` : "—";

function imgBox(key, asin, cls = "", url = null) {
  const src = key ? IMG[key] : null;
  const xm = src && /^(US|CA)_/.test(key) && key.slice(0, 2) !== $("#f-mkt").value;
  if (src) return `<div class="imgbox ${cls}${xm ? " soon" : ""}"><img loading="lazy" src="${esc(src)}" alt="Product photo ${esc(asin || "")}">${xm ? `<div class="cap xm" title="Same ASIN, same listing in both marketplaces">${key.startsWith("US") ? "Amazon.com" : "Amazon.ca"} photo</div>` : ""}</div>`;
  const cap = url ? `<a href="${esc(url)}" target="_blank" rel="noopener">Open photo ↗</a>` : esc(asin || "");
  return `<div class="imgbox soon ${cls}"><img loading="lazy" src="${esc(IMG.COMING_SOON || "")}" alt="Photo coming soon ${esc(asin || "")}"><div class="cap">${cap}</div></div>`;
}
const STK = {"Covered to Nov 30": "ok", "Needs inbound in time": "warn", "Short even with inbound": "bad", "Out of stock now": "bad"};
const fmtD = d => d ? new Date(d + "T12:00:00").toLocaleDateString("en-US", {month: "short", day: "numeric"}) : "—";
const CLS_RANK = {"Direct": 0, "Material not verified": 1, "Alternative material": 2, "Different product type": 3, "Not classified": 4};
const CLS_CHIP = {"Direct": "good", "Alternative material": "", "Material not verified": "warn", "Different product type": "", "Not classified": ""};
const CLS_HEAD = {"Direct": "Direct competitors · same product and same material as ours", "Material not verified": "Same product, material not verified", "Alternative material": "Alternative-material competitors · same product, different material", "Different product type": "Different product type", "Not classified": "Competitors"};
const clsChip = c => c.cls && c.cls !== "Not classified" ? `<span class="chip ${CLS_CHIP[c.cls] || ""}">${esc(c.cls)}${c.mat ? " · " + esc(c.mat) : ""}</span>` : "";
const lpPct = c => (isNum(c.lp) && isNum(c.price) && c.price > 0) ? c.lp / c.price - 1 : null;
const tierChip = t => `<span class="chip ${t === "Aspirational" ? "asp" : t === "Beatable" ? "good" : ""}">${esc(t || "Untiered")}</span>`;
const DEAL = {"Lightning Deal": "deal", "Prime Exclusive Discount": "deal", "Price cut only": "warn", "Coupon only": "warn"};
const dealChip = t => t ? `<span class="chip ${DEAL[t] || ""}">${esc(t)}</span>` : "";

const products = D.products;
const pSel = $("#f-product");
function fillProducts() {
  const mkt = $("#f-mkt").value, keep = pSel.value;
  const order = products.filter(p => p.mkt === mkt);
  const scopeRank = {"Core": 0, "Other": 1, "Launching (partly live)": 2, "Not launched": 3};
  order.sort((a, b) => (scopeRank[a.scope] ?? 1) - (scopeRank[b.scope] ?? 1));
  pSel.innerHTML = ["Core", "Other", "Launching (partly live)", "Not launched"].map(sc => {
    const ps = order.filter(p => (p.scope || "Other") === sc);
    return ps.length ? `<optgroup label="${esc(sc === "Core" ? "Core BFCM products" : sc)}">${ps.map(p => `<option value="${esc(p.short)}">${esc(p.family)} · ${esc(p.short)} — ${esc(p.brand)} ${esc(p.name)}</option>`).join("")}</optgroup>` : "";
  }).join("");
  if ([...pSel.options].some(o => o.value === keep)) pSel.value = keep;
  document.querySelectorAll(".mkt-tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.mkt === mkt)));
}
fillProducts();
document.querySelectorAll(".mkt-tabs button").forEach(b => b.addEventListener("click", () => { $("#f-mkt").value = b.dataset.mkt; fillProducts(); $("#f-brand").value = ""; vcol = vsize = null; render(); }));
$("#builtline").textContent = `Data as of ${D.built} · ${products.length} product listings · ${D.comps.length.toLocaleString("en-US")} competitor rows · cross-checked, see the end of the page`;

let view = "cards", vcol = null, vsize = null;
try { const s = JSON.parse(localStorage.getItem("bfcm-dash") || "{}"); if (s.product) pSel.value = s.product; if (s.mkt) $("#f-mkt").value = s.mkt; if (s.view) view = s.view; } catch (e) {}
fillProducts();

function current() { const short = pSel.value, mkt = $("#f-mkt").value; return products.find(p => p.short === short && p.mkt === mkt) || null; }

function renderOurs(p) {
  const el = $("#ours");
  if (!p) { el.innerHTML = `<div style="grid-column:1/-1" class="empty">We do not sell ${esc(pSel.value)} on Amazon.${$("#f-mkt").value === "CA" ? "ca" : "com"}. Switch marketplace.</div>`; return; }
  const m = p.mkt;
  let vars = p.vars.slice().sort((a, b) => (b.u28 || 0) - (a.u28 || 0));
  if (vcol) vars = vars.filter(v => v.colour === vcol);
  if (vsize) vars = vars.filter(v => v.size === vsize);
  const nLive = p.vars.filter(v => v.live).length;
  const tail = p.vars.length - nLive;
  const sb = p.sb || [];
  el.innerHTML = `
    ${imgBox(p.img, p.best, "", p.imgUrl)}
    <div style="min-width:0">
      <div class="eyebrow">Our product · ${m === "US" ? "Amazon.com" : "Amazon.ca"} · ${esc(p.role)} · ${esc(p.scope || "")}</div>
      <h2>${esc(p.title || (p.brand + " " + p.name))}</h2>
      <div class="asin">Parent ${lnk(p.parent, m)} · Best seller ${lnk(p.best, m)} · Stage ${esc(p.stage || "—")}</div>
      <div class="facts">
        <div class="fact"><div class="k">Our price, best child</div><div class="v">${fmt$(p.price, m)}</div><div class="s">${esc(p.bestLabel)} · ${esc(p.priceSrc || "")}</div></div>
        <div class="fact"><div class="k">Units, last 28 days</div><div class="v">${fmtN(p.u28)}</div><div class="s">${fmtN(p.vars.length)} variations</div></div>
        <div class="fact"><div class="k">Contribution per unit</div><div class="v">${fmt$(p.contrib, m)}</div></div>
        <div class="fact"><div class="k">Break-even ACoS</div><div class="v">${isNum(p.be) ? (p.be <= 1.5 ? fmtP(p.be, 1) : p.be.toFixed(1) + "%") : "—"}</div></div>
        <div class="fact"><div class="k">BFCM 2026 plan</div><div class="v" style="font-family:var(--body);font-size:13.5px">${p.plan26 ? esc(p.plan26) : '<span class="chip bad">Not in a deal</span>'}</div><div class="s">Oct 15${p.plan26 ? "" : " · regular price through BFCM"}</div></div>
        ${p.da ? `<div class="fact wide"><div class="k">Assumed 2026 deal price</div><div class="v">${isNum(p.da.ref) ? `${fmt$(p.da.deal_std, m)} · ${fmt$(p.da.deal_peak, m)}` : "—"}</div><div class="s">From today's ${fmt$(p.da.ref, m)} (${esc(p.da.asin || "")}): ${fmtP(p.da.std)} off Nov 19–26, ${fmtP(p.da.peak)} off Nov 27–30 (team rule). Evidence: ${p.da.ev25 ? `our US BFCM 2025 price on ${esc(p.da.ev25.asin)} ${fmt$(p.da.ev25.pre, "US")} → ${fmt$(p.da.ev25.bf, "US")} (${fmtP(p.da.ev25.depth)} off)` : "no 2025 deal history"}${p.da.comp25 ? ` · rivals' median 2025 cut ${fmtP(p.da.comp25.median)} (${p.da.comp25.n})` : ""}. Amazon may use a lower reference price. Assumption until final prices are set.</div></div>` : ""}
        ${p.stock26 ? `<div class="fact wide"><div class="k">BFCM 2026 stock (Oct 15)</div><div class="v">${fmtN(p.stock26.onHand)} at Amazon · ${fmtN(p.stock26.inbound)} inbound</div><div class="s">Need about ${fmtN(p.stock26.need)} to Nov 30 (${fmtN(p.stock26.need28)} at the 28-day pace) with a ${fmtX(p.stock26.lift)} BFCM lift${/ASSUMED/.test(p.stock26.liftSrc) ? " (assumed: account 2025 lift)" : " (own 2025 lift)"}. <b class="${(p.stock26.counts["Short even with inbound"] || p.stock26.counts["Out of stock now"]) ? "neg" : ""}">${fmtN(p.stock26.counts["Short even with inbound"] || 0)} short, ${fmtN(p.stock26.counts["Out of stock now"] || 0)} out of stock now</b>, ${fmtN(p.stock26.counts["Needs inbound in time"] || 0)} need inbound in time, ${fmtN(p.stock26.counts["Covered to Nov 30"] || 0)} covered.</div></div>` : ""}
        <div class="fact"><div class="k">BFCM 2025 sales lift</div><div class="v">${fmtX(p.lift)}</div><div class="s">BFCM week vs 30 days before</div></div>
        <div class="fact"><div class="k">BFCM 2025 TACoS</div><div class="v">${isNum(p.tacos) ? p.tacos.toFixed(1) + "%" : "—"}</div><div class="s">${isNum(p.preTacos) ? p.preTacos.toFixed(1) + "% before" : ""}</div></div>
        ${p.hk && isNum(p.hk.pre) && isNum(p.hk.bf) ? `<div class="fact"><div class="k">Hero price, BFCM 2025</div><div class="v">${fmt$(p.hk.pre, m)} → ${fmt$(p.hk.bf, m)}</div><div class="s">${p.hk.bf < p.hk.pre ? fmtP(1 - p.hk.bf / p.hk.pre) + " lower" : "no cut"}${p.hk.rank_pre && p.hk.rank_bf ? " · rank " + fmtX(p.hk.rank_pre / p.hk.rank_bf) : ""} · ${esc(p.hk.asin)}</div></div>` : ""}
      </div>
      ${p.colours.length ? `<div class="chipset"><div class="k">Colours (${p.colours.length}) · select to filter the variations below</div><div class="chips">${p.colours.map(c => `<button type="button" class="pick" data-col="${esc(c.name)}" aria-pressed="${vcol === c.name}">${esc(c.name)}<span class="n">${c.n} · ${fmtN(c.u28)} units</span></button>`).join("")}</div></div>` : ""}
      ${p.sizes.length ? `<div class="chipset"><div class="k">Sizes (${p.sizes.length})</div><div class="chips">${p.sizes.map(c => `<button type="button" class="pick" data-size="${esc(c.name)}" aria-pressed="${vsize === c.name}">${esc(c.name)}<span class="n">${c.n} · ${fmtN(c.u28)} units</span></button>`).join("")}</div></div>` : ""}
      ${vars.length ? `<div class="vars" aria-label="Our variations">${vars.map(v => `<div class="var">${imgBox(v.img, v.asin, "", v.url)}<b>${esc([v.size, v.colour].filter(Boolean).join(" · ") || v.asin)}</b>${v.live ? `<span class="pr">${fmt$(v.price, m)}</span>` : `<span class="chip warn">no current price</span>`}${isNum(v.u28) ? ` · ${fmtN(v.u28)} units` : ""}${v.stk ? `<br><span class="stk ${STK[v.stk.st] || ""}">Stock ${fmtN(v.stk.oh)}${v.stk.ib ? ` +${fmtN(v.stk.ib)} inbound` : ""}${v.stk.st !== "Covered to Nov 30" ? ` · ${v.stk.oos ? "out " + fmtD(v.stk.oos) : esc(v.stk.st)}` : ""}</span>` : ""}<br>${lnk(v.asin, m)}</div>`).join("")}</div>
        <div class="sub">${vars.length} of ${p.vars.length} variations shown${vcol || vsize ? ` · filtered by ${esc([vsize, vcol].filter(Boolean).join(" · "))} · <a href="#" id="clearv">show all</a>` : ""} · sorted by units · current price for ${nLive}${tail ? ` (${tail} no current price: out of stock, no Buy Box or not selling)` : ""}</div>` : `<div class="sub" style="margin-top:8px">No variation list for this product.</div>`}
      ${p.stock26 ? (() => { const risk = p.stock26.rows.filter(x => x.st !== "Covered to Nov 30"); return `<details class="more"${risk.length ? " open" : ""}><summary>BFCM 2026 stock: ${fmtN(risk.length)} of ${fmtN(p.stock26.rows.length)} variations at risk</summary>
        <p class="note">On hand = at Amazon now. Inbound = already sent to Amazon (no arrival date yet; shipment status shown). Demand: today's pace to Nov 18, then × ${fmtX(p.stock26.lift)} on Nov 19–30 (${esc(p.stock26.liftSrc)}). "Runs out" assumes no inbound arrives; "with inbound" assumes all of it lands in time.</p>
        ${risk.length ? `<div class="tablewrap"><table><thead><tr><th>Variation</th><th>Child ASIN</th><th class="num">On hand</th><th class="num">Inbound</th><th>Shipments (status: units)</th><th class="num">Sales a day</th><th class="num">Need to Nov 30</th><th class="num">Short</th><th>Runs out</th><th>With inbound</th><th>Status</th></tr></thead>
        <tbody>${risk.map(x => `<tr><td>${esc([x.size, x.colour].filter(Boolean).join(" · ") || x.sku)}</td><td>${lnk(x.asin, m)}</td><td class="num">${fmtN(x.oh)}</td><td class="num">${fmtN(x.ib)}</td><td class="small">${x.ships.length ? x.ships.map(z => `${esc(z.id)} ${esc(z.status.toLowerCase().replace(/_/g, " "))}: ${fmtN(z.units)}`).join("<br>") : "—"}</td><td class="num">${x.vel.toFixed(1)}</td><td class="num">${fmtN(x.need)}</td><td class="num">${x.short ? fmtN(x.short) : "—"}</td><td>${x.oos ? fmtD(x.oos) : "after Nov 30"}</td><td>${x.oosIn ? fmtD(x.oosIn) : "after Nov 30"}</td><td><span class="chip ${STK[x.st] || ""}">${esc(x.st)}</span></td></tr>`).join("")}</tbody></table></div>` : `<p>Every variation is covered to Nov 30 by stock already at Amazon.</p>`}</details>`; })() : ""}
      ${p.slack && p.slack.length ? `<details class="more" open><summary>Deal pricing and decisions (Oct 13–15)</summary><ul class="notes">${p.slack.map(x => `<li><b>${esc(x.topic)}.</b> ${esc(x.detail)}</li>`).join("")}</ul></details>` : ""}
      <details class="more"><summary>Our BFCM 2025 record</summary>
        ${sb.length ? `<div class="tablewrap"><table><thead><tr><th>BFCM 2025${m === "CA" ? " (USD)" : ""}</th><th class="num">Sales</th><th class="num">Units</th><th class="num">Organic units</th><th class="num">Ad units</th><th class="num">Ad cost</th><th class="num">TACoS</th><th class="num">Sessions</th><th class="num">Unit session %</th><th class="num">Avg price</th></tr></thead>
          <tbody>${sb.map(w => `<tr><td>${esc(w.label)}</td><td class="num">${fmt$(w.sales)}</td><td class="num">${fmtN(w.units)}</td><td class="num">${fmtN(w.org)}</td><td class="num">${fmtN(w.ad)}</td><td class="num">${fmt$(w.adcost)}</td><td class="num">${fmtP(w.tacos, 1)}</td><td class="num">${fmtN(w.sessions)}</td><td class="num">${fmtP(w.usp, 1)}</td><td class="num">${fmt$(w.avg)}</td></tr>`).join("")}</tbody></table></div>` : ""}
        <div class="rec">
          ${p.deals ? `<div class="k">Deals</div><div>${p.deals}</div>` : ""}
          ${p.hkLine ? `<div class="k">Hero child, BFCM 2025 price</div><div>${esc(p.hkLine)}</div>` : ""}
          ${p.stock ? `<div class="k">Stock</div><div>${esc(p.stock)}</div>` : ""}
          ${p.stockGap ? `<div class="k">Days with no stock reading</div><div>${esc(p.stockGap)}</div>` : ""}
        </div>
      </details>
    </div>`;
  el.querySelectorAll("[data-col]").forEach(b => b.addEventListener("click", () => { vcol = vcol === b.dataset.col ? null : b.dataset.col; renderOurs(p); }));
  el.querySelectorAll("[data-size]").forEach(b => b.addEventListener("click", () => { vsize = vsize === b.dataset.size ? null : b.dataset.size; renderOurs(p); }));
  const cl = $("#clearv"); if (cl) cl.addEventListener("click", e => { e.preventDefault(); vcol = vsize = null; renderOurs(p); });
}

function filtered(p) {
  const brand = $("#f-brand").value, tier = $("#f-tier").value, deal = $("#f-deal").value, pos = $("#f-pos").value, sv = $("#f-str").value, q = $("#f-q").value.trim().toLowerCase();
  let rows = D.comps.filter(c => p && c.pid === p.pid && c.mkt === p.mkt);
  const cls = $("#f-cls").value;
  if (cls) rows = rows.filter(c => c.cls === cls);
  if (brand) rows = rows.filter(c => c.brand === brand);
  if (tier) rows = rows.filter(c => (c.tier || "Untiered") === tier);
  if (deal) rows = rows.filter(c => c.bf_type === deal);
  if (sv) rows = rows.filter(c => c.str_show === sv);
  if (pos === "below") rows = rows.filter(c => isNum(c.gap) && c.gap < 0);
  if (pos === "above") rows = rows.filter(c => isNum(c.gap) && c.gap >= 0);
  if (q) rows = rows.filter(c => [c.brand, c.title, c.child, c.parent, c.size, c.colour].join(" ").toLowerCase().includes(q));
  const s = $("#f-sort").value, tr = {Aspirational: 0, Beatable: 1, Poor: 2, Untiered: 3};
  const n = v => isNum(v) ? v : null;
  const by = {wk: c => -(n(c.wk) ?? -1), rev: c => -(n(c.rev) ?? -1), price: c => n(c.price) ?? 1e9, bsr: c => n(c.bsr) ?? 1e12, reviews: c => -(n(c.reviews) ?? -1), lose: c => -(n(c.we_lose) ?? -1), tier: c => (tr[c.tier] ?? 4) * 1e7 - (n(c.wk) ?? 0)}[s];
  return rows.slice().sort((a, b) => (CLS_RANK[a.cls] ?? 4) - (CLS_RANK[b.cls] ?? 4) || by(a) - by(b));
}

function renderBrands(p) {
  const keep = $("#f-brand").value;
  const brands = [...new Set(D.comps.filter(c => p && c.pid === p.pid && c.mkt === p.mkt).map(c => c.brand).filter(Boolean))].sort((a, b) => a.localeCompare(b));
  $("#f-brand").innerHTML = `<option value="">All brands (${brands.length})</option>` + brands.map(b => `<option>${esc(b)}</option>`).join("");
  if (brands.includes(keep)) $("#f-brand").value = keep;
}

function renderKpis(p, rows) {
  const m = p ? p.mkt : "US", isCA = m === "CA";
  const prices = rows.map(c => c.price).filter(isNum).sort((a, b) => a - b);
  const med = prices.length ? (prices.length % 2 ? prices[prices.length >> 1] : (prices[prices.length / 2 - 1] + prices[prices.length / 2]) / 2) : null;
  const below = rows.filter(c => isNum(c.gap) && c.gap < 0).length;
  const wk = rows.reduce((s, c) => s + (isNum(c.wk) ? c.wk : 0), 0);
  const rev = rows.reduce((s, c) => s + (isNum(c.rev) ? c.rev : 0), 0);
  const ourwk = p && isNum(p.u28) ? p.u28 / 4 : null;
  const lose = rows.reduce((s, c) => s + (c.we_lose || 0), 0), win = rows.reduce((s, c) => s + (c.we_win || 0), 0);
  const strY = rows.filter(c => c.str_show === "Y").length, strK = rows.filter(c => c.str_show === "Y" || c.str_show === "N").length;
  const bf = rows.filter(c => c.bf_type).length;
  const k = [
    ["Competitors", fmtN(rows.length), `${fmtN(rows.filter(c => c.cls === "Direct").length)} direct · ${fmtN(rows.filter(c => c.cls === "Alternative material").length)} alternative material`],
    ["Median price", fmt$(med, m), p ? "ours " + fmt$(p.price, m) : ""],
    ["Priced below us", fmtN(below), "same size where we sell it"],
    ["Strikethrough on page", strK ? `${strY} of ${strK}` : "—", "Amazon page check"],
    ["Est. weekly units", isCA || !wk ? "—" : fmtN(wk), isCA ? "not available for Canada" : (ourwk !== null && wk ? `ours about ${fmtN(ourwk)} a week (${fmtP(ourwk / (ourwk + wk), 1)} share)` : "")],
    ["Est. monthly revenue", isCA || !rev ? "—" : fmt0$(rev, m), isCA ? "not available for Canada" : "these competitors' tracked ASINs"],
    ["Keywords we win / lose", isCA ? "—" : `${fmtN(win)} / ${fmtN(lose)}`, isCA ? "not available for Canada" : "shared keywords, summed"],
    ["With BFCM 2025 history", `${fmtN(bf)} of ${fmtN(rows.length)}`, "Nov 1 – Dec 5, 2025"],
  ];
  $("#kpis").innerHTML = k.map(([a, b, c]) => `<div class="kpi"><div class="k">${a}</div><div class="v">${b}</div><div class="s">${esc(c)}</div></div>`).join("");
}

function card(c) {
  const m = c.mkt, g = c.gap;
  const gChip = !isNum(g) ? "" : `<span class="chip ${g < 0 ? "bad" : ""}">${g > 0 ? "+" : ""}${fmtP(g)} vs ours</span>`;
  const lpp = lpPct(c);
  const strChip = c.str_show === "Y" ? `<span class="chip good">Strikethrough ${fmt$(c.str_price, m)}</span>` : c.str_show === "N" ? `<span class="chip">No strikethrough</span>` : "";
  const pd = (isNum(c.pd) && isNum(c.pd_pre) && c.pd_pre >= 5) ? c.pd / c.pd_pre : null;
  return `<article class="card" tabindex="0" data-uid="${c.uid}" aria-label="${esc(c.brand)} profile">
    ${imgBox(c.img, c.child)}
    <div class="head"><div class="brand">${esc(c.brand || "Unknown brand")}</div>${tierChip(c.tier)}</div>
    <div class="title" title="${esc(c.title)}">${esc(c.title)}</div>
    <div class="asin">${esc(c.child || "—")}${c.size ? " · " + esc(c.size) : ""}${c.colour ? " · " + esc(c.colour) : ""}</div>
    <div class="tags">${clsChip(c)}${gChip}${strChip}${isNum(lpp) && lpp > 0 ? `<span class="chip">List ${fmtP(lpp)} over</span>` : ""}${c.stock_now === "N" ? '<span class="chip bad">Unavailable</span>' : ""}</div>
    <div class="nums">
      <div><div class="k">Price</div><div class="v">${fmt$(c.price, m)}</div></div>
      <div><div class="k">List</div><div class="v">${fmt$(c.lp, m)}</div></div>
      <div><div class="k">Rank</div><div class="v">${fmtN(c.bsr)}</div></div>
      <div><div class="k">Units / wk</div><div class="v">${fmtN(c.wk)}</div></div>
      <div><div class="k">Revenue / mo</div><div class="v">${fmt0$(c.rev, m)}</div></div>
      <div><div class="k">Rating</div><div class="v">${isNum(c.rating) ? c.rating.toFixed(1) : "—"} <span class="sub">(${fmtN(c.reviews)})</span></div></div>
    </div>
    <div class="strat">${c.contested != null ? `Shared keywords <b>${fmtN(c.contested)}</b> · we win <b>${fmtN(c.we_win)}</b>, lose <b>${fmtN(c.we_lose)}</b><br>` : ""}${c.top_kw ? `Top keyword <b>${esc(c.top_kw)}</b>${isNum(c.org_pct) ? ` · ${fmtP(c.org_pct)} organic` : ""}<br>` : ""}${pd !== null ? `Prime Day 2026 visibility ${fmtX(pd)}<br>` : ""}${c.bf_type ? `<b>BFCM 2025</b> ${dealChip(c.bf_type)}${isNum(c.bf_low) && isNum(c.bf_pre) ? ` ${fmt$(c.bf_pre, m)} → ${fmt$(c.bf_low, m)}` : ""}${isNum(c.bsr_lift_v) ? ` · rank ${fmtX(c.bsr_lift_v)}` : ""}` : `<span>BFCM 2025: ${m === "CA" ? "price history pending" : "no price history"}</span>`}</div>
    <div class="open">Full profile →</div>
  </article>`;
}

function table(rows) {
  const cols = [["", c => imgBox(c.img, "", "thumb")], ["Brand", c => esc(c.brand)], ["Type", c => esc(c.cls || "—")], ["Material", c => esc(c.mat || "—")], ["Tier", c => esc(c.tier || "Untiered")], ["Child ASIN", c => esc(c.child || "—")],
    ["Size", c => esc(c.size || "—")], ["Colour", c => esc(c.colour || "—")],
    ["Price", c => fmt$(c.price, c.mkt), 1], ["List", c => fmt$(c.lp, c.mkt), 1], ["vs ours", c => isNum(c.gap) ? (c.gap > 0 ? "+" : "") + fmtP(c.gap) : "—", 1], ["Rank", c => fmtN(c.bsr), 1],
    ["Units / wk", c => fmtN(c.wk), 1], ["Revenue / mo", c => fmt0$(c.rev, c.mkt), 1], ["Rating", c => isNum(c.rating) ? c.rating.toFixed(1) : "—", 1], ["Reviews", c => fmtN(c.reviews), 1],
    ["BFCM 2025", c => esc(c.bf_type || "—")], ["2025 rank change", c => fmtX(c.bsr_lift_v), 1], ["We win", c => fmtN(c.we_win), 1], ["We lose", c => fmtN(c.we_lose), 1]];
  return `<div class="tablewrap"><table><thead><tr>${cols.map(c => `<th class="${c[2] ? "num" : ""}">${c[0]}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr class="click" tabindex="0" data-uid="${r.uid}">${cols.map(c => `<td class="${c[2] ? "num" : ""}">${c[1](r)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}

function kv(items) {
  return `<div class="kv">${items.filter(Boolean).map(([k, v, s]) => `<div><div class="k">${k}</div><div class="v">${v ?? "—"}</div>${s ? `<div class="s">${s}</div>` : ""}</div>`).join("")}</div>`;
}
function openComp(uid) {
  const c = D.comps.find(x => x.uid === uid); if (!c) return;
  const m = c.mkt, r = c.ro || {};
  const yn = v => v === "Y" ? "Yes" : v === "N" ? "No" : (v || "—");
  $("#sheet-root").innerHTML = `<div class="scrim" id="scrim"></div>
  <aside class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t">
    <div class="sheet-h">${imgBox(c.img, c.child)}
      <div style="min-width:0"><div class="eyebrow">${esc(c.product)} · ${m === "CA" ? "Amazon.ca" : "Amazon.com"}</div>
        <h2 id="sh-t">${esc(c.brand || "—")} ${tierChip(c.tier)}</h2>
        <div class="sub">${esc(c.title || "")}</div>
        <div class="asin" style="margin-top:4px">Child ${lnk(c.child, m)} · Parent ${lnk(c.parent, m)}</div></div>
      <button type="button" class="x" id="sh-x" aria-label="Close">×</button></div>
    <div class="sheet-b">
      ${c.cls && c.cls !== "Not classified" ? `<div class="grp"><h3>Competitor type</h3><p class="note"><span class="chip ${CLS_CHIP[c.cls] || ""}">${esc(c.cls)}</span> ${esc(c.cls_why || "")}</p></div>` : ""}
      <div class="grp"><h3>Price and offer</h3>${kv([
        ["Price", fmt$(c.price, m), esc(c.price_src || "")],
        ["List price", fmt$(c.lp, m)],
        ["Strikethrough on page", c.str_show === "Y" ? `${esc(c.str_label || "Shown")} ${fmt$(c.str_price, m)}` : c.str_show === "N" ? "Not shown" : "—", c.str_checked ? "checked " + esc(c.str_checked.slice(0, 10)) : ""],
        ["Deal on page", esc(c.deal_now || r.deal || "none")],
        ["In stock", r.inStock === true ? "Yes" : r.inStock === false ? "No" : yn(c.stock_now)],
        ["Our price, same size", fmt$(c.our_same, m)],
        ["Price vs ours", isNum(c.gap) ? (c.gap > 0 ? "+" : "") + fmtP(c.gap, 1) : "—", esc((c.basis || "").split(".")[0])],
      ])}</div>
      <div class="grp"><h3>Sales and revenue</h3>${kv([
        ["Units a week, this ASIN", fmtN(c.wk), "estimate"],
        ["Revenue a month, this ASIN", fmt0$(c.rev, m), "price × weekly units × 52 ÷ 12"],
        r.salesPerWeek != null ? ["Sales a week, whole listing", fmtN(r.salesPerWeek), r.salesBand ? `Sales band ${fmtN(r.salesBand.lo)} – ${fmtN(r.salesBand.hi)}` : ""] : null,
        ["Best Seller Rank", fmtN(c.bsr), r.bsrTrendDirection ? `${esc(r.bsrTrendDirection)}${isNum(r.bsrTrendPct) ? ", " + r.bsrTrendPct.toFixed(1) + "% over 6 weeks" : ""}` : ""],
        c.dd30 != null ? ["Sales, last 30 days", fmtN(c.dd30), "whole listing"] : null,
        ["Variations in listing", fmtN(c.var), esc(c.var_src || "")],
      ])}</div>
      <div class="grp"><h3>Reviews and listing</h3>${kv([
        ["Rating", isNum(c.rating) ? c.rating.toFixed(1) + " ★" : "—"], ["Reviews", fmtN(c.reviews)],
        r.reviewVelocity != null ? ["New reviews a week", isNum(r.reviewVelocity) ? r.reviewVelocity.toFixed(1) : "—"] : null,
        ["Size", esc(c.size || "—")], ["Colour", esc(c.colour || "—")], ["Listed", esc(c.listed || "—")],
        c.ful ? ["Fulfilment", esc(c.ful)] : null, c.country ? ["Seller country", esc(c.country)] : null,
        r.hasAplus != null ? ["A+ content", r.hasAplus ? "Yes" : "No"] : null, r.imageCount != null ? ["Images", fmtN(r.imageCount)] : null, r.bulletCount != null ? ["Bullet points", fmtN(r.bulletCount)] : null,
      ])}</div>
      ${c.asi_tr != null || c.contested != null ? `<div class="grp"><h3>Search and ads</h3>${kv([
        ["Traffic, 7 days", fmtN(c.asi_tr), "impression-like, not clicks"], ["Keywords ranked", fmtN(c.asi_kw)],
        ["Organic / ad share", isNum(c.org_pct) ? `${fmtP(c.org_pct)} / ${fmtP(c.ad_pct)}` : "—"],
        ["Top keyword", esc(c.top_kw || "—"), isNum(c.top_kw_pct) ? fmtP(c.top_kw_pct, 1) + " of traffic" : ""],
        ["Sponsored Products reach", fmtP(c.r_sp)], ["Sponsored Brands reach", fmtP(c.r_sb)], ["Brand video reach", fmtP(c.r_sbv)], ["Amazon's Choice reach", fmtP(c.r_ac)],
        ["Keywords we share", fmtN(c.contested), `we win ${fmtN(c.we_win)} · we lose ${fmtN(c.we_lose)}`],
        ["Their keywords we miss", fmtN(c.theirs_only), isNum(c.theirs_only_share) ? fmtP(c.theirs_only_share, 1) + " of their traffic" : ""],
        ["They advertise, we don't", fmtN(c.ppc_none), "keywords"], ["They out-bid us", fmtN(c.ppc_aggr), "keywords"],
      ])}${c.hero ? `<div class="sub" style="margin-top:8px">Hero children (share of visibility): ${esc(c.hero)}</div>` : ""}</div>` : ""}
      ${c.pd_pre != null || c.q2 != null ? `<div class="grp"><h3>Organic visibility score</h3>${kv([
        ["Before Prime Day 2026", isNum(c.pd_pre) ? c.pd_pre.toFixed(1) : "—"], ["Prime Day 2026", isNum(c.pd) ? c.pd.toFixed(1) : "—", isNum(c.pd) && isNum(c.pd_pre) && c.pd_pre > 0 ? fmtX(c.pd / c.pd_pre) + " of before" : ""],
        ["Q2 2026 average", isNum(c.q2) ? c.q2.toFixed(1) : "—"], ["Last 30 days", isNum(c.l30) ? c.l30.toFixed(1) : "—"],
      ])}</div>` : ""}
      <div class="grp"><h3>BFCM 2025</h3>${c.bf_type ? kv([
        ["Deal type", dealChip(c.bf_type), esc(c.bf_dates || "")],
        ["Price before, median Nov 1 – 19", fmt$(c.bf_pre, m)], ["Lowest in BFCM week", fmt$(c.bf_low, m)], ["Discount", isNum(c.bf_disc_v) ? fmtP(c.bf_disc_v, 1) : "—"],
        ["Rank before", fmtN(c.bsr_pre)], ["Rank in BFCM week", fmtN(c.bsr_bf)], ["Rank change", fmtX(c.bsr_lift_v), "above 1.00x means it improved"], ["Out of stock in BFCM week", yn(c.bf_oos)],
      ]) + (c.notes ? `<div class="sub" style="margin-top:8px">${esc(c.notes)}</div>` : "") : `<div class="sub">${m === "CA" ? "Canadian price history is being added." : "No Buy Box history for this ASIN in Nov – Dec 2025."}</div>`}</div>
      ${r.tierRationale || r.beatability != null ? `<div class="grp"><h3>Grade</h3>${kv([["Tier", tierChip(c.tier)], ["Beatability score", fmtN(r.beatability)]])}${r.tierRationale ? `<div class="sub" style="margin-top:8px">${esc(r.tierRationale)}</div>` : ""}</div>` : ""}
    </div></aside>`;
  const close = () => { $("#sheet-root").innerHTML = ""; document.removeEventListener("keydown", onKey); };
  const onKey = e => { if (e.key === "Escape") close(); };
  $("#sh-x").addEventListener("click", close); $("#scrim").addEventListener("click", close); document.addEventListener("keydown", onKey);
  $("#sh-x").focus();
}

function renderGuide() {
  const rows = [
    ["What this is", "Every product we sell in the US and Canada, the competitors the market data maps to it, and what each did in BFCM 2025, to plan BFCM 2026 (Nov 19 – 30)."],
    ["Our price", "Live Amazon price of our best-selling variation (catalog price Oct 13 US / Oct 14 CA, or the Amazon page). Variations without a live price are out of stock, have no Buy Box, or are not selling."],
    ["BFCM 2026 plan", "the team's deal list (Oct 15). Not yet visible in Amazon's deal feed."],
    ["Our prices", "catalog price only (US Oct 13, CA Oct 14), the single price source. A variation missing from catalog shows \"not in catalog\" instead of a price from another source."],
    ["BFCM 2026 stock", "account data inventory, Oct 15. On hand = units at Amazon now; inbound = units already sent to Amazon (no ETA in account data, so the shipment status is shown). Demand = account data's current pace to Nov 18, then × the product's own BFCM 2025 lift for Nov 19–30; where that lift is missing or unreliable the account's BFCM 2025 lift is assumed (US 2.74x, CA 3.14x) and labelled. account data's pace runs about 1.5x the 28-day units on the big products, so the 28-day figure is shown as a cross-check. Status: covered by stock at Amazon / needs the inbound in time / short even with inbound / out of stock now."],
    ["Deal pricing and decisions", "From the team's deal reviews (Oct 13–15): Amazon's current reference and maximum deal price per product, and whether each pre-BFCM deal is kept or cancelled. Amazon's BFCM deal price is the lower of the lowest deal price still in the lookback and 15% below its reference. AB's STR tests: 2–4 day holds failed; 9+ day holds have worked; readout Oct 20."],
    ["Assumed 2026 deal price", "Until the team sends final prices. the team rule (Oct 15): 15% off today's live price of the hero variation on Nov 19–26, 20% off on the high days, taken as Black Friday to Cyber Monday (Nov 27–30) until confirmed. Shown beside it as evidence: our own BFCM 2025 cut on that variation (price history) and the median cut of this product's competitors in BFCM 2025. Amazon sets the deal reference price the day before and it can be lower than today's price, which would lower the deal price."],
    ["BFCM 2025 sales lift", "Average daily sales in BFCM week (Nov 20 – Dec 1, 2025) ÷ average daily sales in the 30 days before. account data actual sales."],
    ["Competitor price", "Price of the competitor's tracked variation: the Amazon page (Oct 13 – 14) where checked, otherwise the market data snapshot (Oct 12)."],
    ["Units / wk, Revenue / mo", "market data estimate for the tracked variation; revenue = price × weekly units × 52 ÷ 12. The profile also shows the whole listing's sales range."],
    ["Strikethrough", "Whether Amazon shows a crossed-out List Price or Typical price on the page today (page check)."],
    ["BFCM 2025 deal and rank change", "price history, daily close. Deal type found in BFCM week; discount = lowest BFCM price vs the median Nov 1 – 19 price; rank change = median rank before ÷ median rank in BFCM week (above 1.00x = better)."],
    ["Tier", "The market data grade of each competitor against this product: Beatable, Aspirational, Poor or ungraded."],
    ["Blank values", "Blank means unknown. Nothing missing is shown as 0. Canada figures are CAD and kept apart from the US."],
  ];
  $("#guide").innerHTML = `<details><summary>How to read this tracker</summary><div class="tablewrap"><table><tbody>${rows.map(([k, v]) => `<tr><td style="width:220px"><b>${esc(k)}</b></td><td class="sub">${esc(v)}</td></tr>`).join("")}</tbody></table></div></details>`;
}
function renderChecks() {
  const ok = D.checks.filter(c => c.status === "Match").length;
  $("#checks").innerHTML = `<details><summary>Verification · ${D.checks.length} cross-checks, ${ok} exact matches</summary>
    <div class="tablewrap"><table><thead><tr><th>Check</th><th>Compared</th><th>Result</th><th>Detail</th></tr></thead><tbody>
    ${D.checks.map(c => `<tr><td><b>${esc(c.name)}</b></td><td class="sub">${esc(c.compared)}</td><td><span class="chip ${c.status === "Match" ? "good" : "warn"}">${esc(c.status)}</span></td><td class="sub">${esc(c.detail)}</td></tr>`).join("")}</tbody></table></div>
    <div class="tablewrap"><table><thead><tr><th>Data</th><th>As of</th><th class="num">Rows</th></tr></thead><tbody>
    ${D.sources.map(s => `<tr><td><b>${esc(s.data)}</b></td><td class="asin">${esc(s.asof)}</td><td class="num">${fmtN(s.rows)}</td></tr>`).join("")}</tbody></table></div>
  </details>`;
}

function render() {
  const p = current();
  renderOurs(p);
  renderBrands(p);
  const rows = filtered(p);
  renderKpis(p, rows);
  $("#count").textContent = `Competitors · ${rows.length}`;
  $("#list").innerHTML = !p ? "" : rows.length === 0
    ? `<div class="empty">No competitors match these filters.</div>`
    : (view === "cards" ? [...new Set(rows.map(c => c.cls || "Not classified"))].map(k => { const g = rows.filter(c => (c.cls || "Not classified") === k); return `<h3 class="grp-h">${esc(CLS_HEAD[k] || k)} <span>${fmtN(g.length)}</span></h3><div class="grid">${g.map(card).join("")}</div>`; }).join("") : table(rows));
  $("#list").querySelectorAll("[data-uid]").forEach(el => { const go = () => openComp(el.dataset.uid); el.addEventListener("click", go); el.addEventListener("keydown", e => { if (e.key === "Enter") go(); }); });
  try { localStorage.setItem("bfcm-dash", JSON.stringify({product: pSel.value, mkt: $("#f-mkt").value, view})); } catch (e) {}
}
["#f-product", "#f-mkt", "#f-cls", "#f-brand", "#f-tier", "#f-deal", "#f-str", "#f-pos", "#f-sort"].forEach(s => $(s).addEventListener("change", () => { if (s === "#f-product" || s === "#f-mkt") { $("#f-brand").value = ""; vcol = vsize = null; } render(); }));
$("#f-q").addEventListener("input", render);
$("#v-cards").addEventListener("click", () => { view = "cards"; $("#v-cards").setAttribute("aria-pressed", "true"); $("#v-table").setAttribute("aria-pressed", "false"); render(); });
$("#v-table").addEventListener("click", () => { view = "table"; $("#v-table").setAttribute("aria-pressed", "true"); $("#v-cards").setAttribute("aria-pressed", "false"); render(); });
if (view === "table") { $("#v-table").setAttribute("aria-pressed", "true"); $("#v-cards").setAttribute("aria-pressed", "false"); }
renderGuide();
renderChecks();
render();
</script>
