<title>BFCM 2026 Competitor Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky control bar, then one working surface per view (portfolio table, product workspace, verification). Detail opens in a side sheet. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --sunk:#eef1f4; --ink:#17212b; --muted:#5a6673; --faint:#8a95a1; --line:#dbe0e6; --line-strong:#c4ccd5;
  --accent:#1f4f82; --accent-ink:#ffffff; --accent-soft:#e5edf6;
  --good:#1d6f45; --good-soft:#e2f2e9; --warn:#8a5a00; --warn-soft:#fbf0d9; --bad:#a3271c; --bad-soft:#fbe6e3; --deal:#6b3fa0; --deal-soft:#efe8f7;
  --shadow:0 12px 40px rgba(16,28,44,.18);
  --f-ui:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1319; --surface:#151c24; --sunk:#1b232d; --ink:#e4e9ef; --muted:#9ba7b4; --faint:#6f7b88; --line:#26303b; --line-strong:#34404d;
  --accent:#86b4e8; --accent-ink:#0e1319; --accent-soft:#1c2a3a;
  --good:#6cc596; --good-soft:#15291f; --warn:#e2b056; --warn-soft:#2c2412; --bad:#f08a7e; --bad-soft:#2f1a18; --deal:#c3a3ec; --deal-soft:#251d33;
  --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e1319; --surface:#151c24; --sunk:#1b232d; --ink:#e4e9ef; --muted:#9ba7b4; --faint:#6f7b88; --line:#26303b; --line-strong:#34404d;
  --accent:#86b4e8; --accent-ink:#0e1319; --accent-soft:#1c2a3a;
  --good:#6cc596; --good-soft:#15291f; --warn:#e2b056; --warn-soft:#2c2412; --bad:#f08a7e; --bad-soft:#2f1a18; --deal:#c3a3ec; --deal-soft:#251d33;
  --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums}
a{color:var(--accent)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:12.5px}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.wrap{max-width:1440px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* control bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px}
.brand{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.brand b{font-size:16px;font-weight:700;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted)}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav button,.seg button{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:6px;cursor:pointer;font-weight:500;font-size:13px}
.nav button[aria-pressed="true"],.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.picker{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,input[type="search"]{border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:6px 10px;font-size:13px;max-width:100%}

main{padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}
h1{font-size:22px;line-height:1.25;margin:0;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:15px;margin:0;font-weight:600;letter-spacing:.01em}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.panel-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel-b{padding:16px}

/* summary strip */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.kpi{padding:14px 16px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0;min-width:0}
.kpi .k{font-size:11.5px;color:var(--muted);font-weight:500}
.kpi .v{font-size:20px;font-weight:600;margin-top:2px;letter-spacing:-.01em}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}

/* product header */
.ph{display:grid;grid-template-columns:132px minmax(0,1fr);gap:18px;padding:16px}
.thumb{width:100%;aspect-ratio:1;border-radius:6px;background:var(--sunk);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;max-width:100%}
.thumb img{width:100%;height:100%;object-fit:contain;background:#fff}
.thumb .ph-t{font-size:11px;color:var(--faint);text-align:center;padding:6px;line-height:1.3}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px 22px;margin-top:14px}
.fact .k{font-size:11.5px;color:var(--muted);font-weight:500}
.fact .v{font-size:15px;font-weight:600;margin-top:1px}
.fact .s{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.chip .n{color:var(--muted);font-size:11.5px}
.pill{display:inline-block;border-radius:4px;padding:1px 7px;font-size:11.5px;font-weight:600;white-space:nowrap}
.p-good{background:var(--good-soft);color:var(--good)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)}
.p-deal{background:var(--deal-soft);color:var(--deal)} .p-neutral{background:var(--sunk);color:var(--muted)} .p-acc{background:var(--accent-soft);color:var(--accent)}
.note{font-size:12.5px;color:var(--muted);line-height:1.5}
.lines{display:flex;flex-direction:column;gap:8px}
.line{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;font-size:13px;padding-block:6px;border-top:1px solid var(--line)}
.line:first-child{border-top:0}
.line .k{color:var(--muted);font-weight:500}

/* tabs inside product */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:11px 12px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.toolbar .grow{flex:1 1 220px;min-width:0}
.toolbar .grow input{width:100%}

/* tables */
.tw{overflow-x:auto;max-height:70vh}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th{position:sticky;top:0;background:var(--sunk);color:var(--muted);font-weight:600;font-size:11.5px;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
th.sortable{cursor:pointer}
th.sortable:hover{color:var(--ink)}
th .arr{font-size:10px;margin-left:3px}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--accent-soft)}
tbody tr.ours td{background:var(--sunk)}
.tt{max-width:340px;min-width:200px}
.tt .t1{font-weight:600}
.tt .t2{color:var(--muted);font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mini{width:40px;height:40px;border-radius:4px;background:var(--sunk);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}
.mini img{width:100%;height:100%;object-fit:contain;background:#fff}
.mini i{font-style:normal;font-size:9px;color:var(--faint)}
.cellrow{display:flex;gap:10px;align-items:center}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

/* side sheet */
.scrim{position:fixed;inset:0;background:rgba(10,16,24,.35);z-index:40}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--surface);z-index:41;box-shadow:var(--shadow);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.sheet-h{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:14px;padding:16px;border-bottom:1px solid var(--line)}
.sheet-b{overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:18px}
.x{border:1px solid var(--line);background:var(--surface);border-radius:6px;width:34px;height:34px;cursor:pointer;font-size:18px;line-height:1}
.grp h3{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));border:1px solid var(--line);border-radius:6px;overflow:hidden}
.kv>div{background:var(--surface);padding:9px 11px;min-width:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0}
.kv .k{font-size:11.5px;color:var(--muted)}
.kv .v{font-size:14px;font-weight:600;overflow-wrap:anywhere}
.kv .s{font-size:11.5px;color:var(--muted)}
.bar-row{display:grid;grid-template-columns:110px minmax(0,1fr) 60px;gap:10px;align-items:center;font-size:12.5px}
.track{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.track span{display:block;height:100%;background:var(--accent);border-radius:4px}

@media (max-width:720px){
  .ph{grid-template-columns:84px minmax(0,1fr)}
  .sheet-h{grid-template-columns:64px minmax(0,1fr) auto}
  .line{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){ .sheet{animation:slide .18s ease-out} @keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}} }
</style>

<div class="bar"><div class="wrap">
  <div class="brand"><b>BFCM 2026 Competitor Tracker</b><span id="asof"></span></div>
  <div class="nav" role="group" aria-label="View">
    <button type="button" id="nv-portfolio" data-view="portfolio">All products</button>
    <button type="button" id="nv-product" data-view="product">Product</button>
    <button type="button" id="nv-verify" data-view="verify">Verification &amp; sources</button>
  </div>
  <div class="picker">
    <label class="faint" for="pick">Product</label>
    <select id="pick"></select>
  </div>
</div></div>

<main class="wrap" id="app"></main>
<div id="sheet-root"></div>

<script>
const D = /*__DATA__*/null;
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const isNum = v => typeof v === "number" && isFinite(v);
const cur = m => m === "CA" ? "C$" : "$";
const money = (v, m) => isNum(v) ? cur(m) + v.toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2}) : "—";
const money0 = (v, m) => isNum(v) ? cur(m) + Math.round(v).toLocaleString("en-US") : "—";
const int = v => isNum(v) ? Math.round(v).toLocaleString("en-US") : "—";
const pct = (v, d = 1) => isNum(v) ? (v * 100).toFixed(d) + "%" : "—";
const xf = v => isNum(v) ? v.toFixed(2) + "x" : "—";
const amz = (a, m) => a ? `https://www.amazon.${m === "CA" ? "ca" : "com"}/dp/${a}` : null;
const link = (a, m) => a ? `<a class="mono" href="${amz(a, m)}" target="_blank" rel="noopener">${esc(a)}</a>` : "—";
const imgBox = (src, cls, label) => `<div class="${cls}">${src ? `<img src="${esc(src)}" alt="" loading="lazy">` : `<${cls === "mini" ? "i" : "div class='ph-t'"}>${cls === "mini" ? "photo<br>due" : "Photo arrives with the image file<br>" + esc(label || "")}</${cls === "mini" ? "i" : "div"}>`}</div>`;
const TIERS = {Beatable: "p-good", Aspirational: "p-acc", Poor: "p-neutral", Untiered: "p-neutral"};
const tierPill = t => `<span class="pill ${TIERS[t] || "p-neutral"}">${esc(t || "Untiered")}</span>`;
const DEALS = {"Lightning Deal": "p-deal", "Prime Exclusive Discount": "p-deal", "Price cut only": "p-warn", "Coupon only": "p-warn", "None": "p-neutral", "Not live in 2025": "p-neutral"};
const dealPill = t => t ? `<span class="pill ${DEALS[t] || "p-neutral"}">${esc(t)}</span>` : `<span class="faint">no history</span>`;

const S = {view: "portfolio", key: null, tab: "summary", vq: "", vsize: null, vcol: null, vsort: ["u28", -1], cq: "", ctier: "", cdeal: "", csort: ["wk", -1], pmkt: "US", psort: ["lift", -1]};
try { const s = JSON.parse(localStorage.getItem("bfcm26") || "{}"); Object.assign(S, {view: s.view || S.view, key: s.key || null, tab: s.tab || S.tab}); } catch (e) {}
const save = () => { try { localStorage.setItem("bfcm26", JSON.stringify({view: S.view, key: S.key, tab: S.tab})); } catch (e) {} };

const P = Object.fromEntries(D.products.map(p => [p.key, p]));
const compsOf = k => D.comps.filter(c => c.key === k);
if (!S.key || !P[S.key]) S.key = (D.products.find(p => p.pid === 59 && p.mkt === "US") || D.products[0]).key;

$("#asof").textContent = `Data as of ${D.built} · ${D.products.length} product listings · ${D.comps.length} competitor rows`;
const pick = $("#pick");
const groups = {};
D.products.forEach(p => (groups[p.scope] = groups[p.scope] || []).push(p));
["Core", "Launching (partly live)", "Not launched", "Other"].forEach(g => {
  if (!groups[g]) return;
  const og = document.createElement("optgroup"); og.label = g;
  groups[g].forEach(p => { const o = document.createElement("option"); o.value = p.key; o.textContent = `${p.mkt} · ${p.short} — ${p.name}`; og.appendChild(o); });
  pick.appendChild(og);
});
pick.addEventListener("change", () => { S.key = pick.value; S.view = "product"; S.vsize = S.vcol = null; S.vq = S.cq = ""; render(); });
document.querySelectorAll(".nav button").forEach(b => b.addEventListener("click", () => { S.view = b.dataset.view; render(); }));

function sorter(rows, [k, dir]) {
  return rows.slice().sort((a, b) => {
    const x = a[k], y = b[k];
    if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1;
    return (typeof x === "string" ? x.localeCompare(y) : x - y) * dir;
  });
}
function th(label, k, st, cls = "") {
  const on = st[0] === k;
  return `<th class="sortable ${cls}" data-sort="${k}" aria-sort="${on ? (st[1] > 0 ? "ascending" : "descending") : "none"}">${label}${on ? `<span class="arr">${st[1] > 0 ? "▲" : "▼"}</span>` : ""}</th>`;
}
function bindSort(root, key) {
  root.querySelectorAll("th.sortable").forEach(h => h.addEventListener("click", () => {
    const k = h.dataset.sort; S[key] = [k, S[key][0] === k ? -S[key][1] : (k === "brand" || k === "short" ? 1 : -1)]; render();
  }));
}

/* ---------------- portfolio ---------------- */
function portfolio() {
  const rows = D.products.filter(p => p.mkt === S.pmkt).map(p => {
    const cs = compsOf(p.key);
    return Object.assign({}, p, {nComp: cs.length, nBf: cs.filter(c => c.bf_type).length});
  });
  const core = rows.filter(r => r.scope === "Core");
  const lifts = core.filter(r => isNum(r.lift));
  const sum = D.summary[S.pmkt] || {};
  return `
  <section class="kpis" aria-label="Summary">
    <div class="kpi"><div class="k">Product listings (${S.pmkt})</div><div class="v">${rows.length}</div><div class="s">${core.length} in the core BFCM set</div></div>
    <div class="kpi"><div class="k">Competitors tracked</div><div class="v">${int(sum.comps)}</div><div class="s">${int(sum.compRows)} product–competitor pairs</div></div>
    <div class="kpi"><div class="k">With BFCM 2025 history</div><div class="v">${int(sum.withBf)}</div><div class="s">of ${int(sum.comps)} competitors (Keepa)</div></div>
    <div class="kpi"><div class="k">Our BFCM 2025 lift, core</div><div class="v">${lifts.length ? xf(lifts.reduce((a, r) => a + r.lift, 0) / lifts.length) : "—"}</div><div class="s">average daily sales, BFCM week vs 30 days before</div></div>
    <div class="kpi"><div class="k">Account lift, BFCM 2025</div><div class="v">${xf(sum.accountLift)}</div><div class="s">SellerBoard, all ${S.pmkt} sales</div></div>
  </section>
  <section class="panel">
    <div class="panel-h"><h2>All products</h2>
      <div class="seg nav" role="group" aria-label="Marketplace">
        <button type="button" id="pm-US" aria-pressed="${S.pmkt === "US"}">US</button><button type="button" id="pm-CA" aria-pressed="${S.pmkt === "CA"}">Canada</button>
      </div></div>
    <div class="tw"><table>
      <thead><tr>${th("Product", "short", S.psort)}${th("Scope", "scope", S.psort)}${th("Our price, best child", "price", S.psort, "n")}${th("Units, 28 days", "u28", S.psort, "n")}
      ${th("BFCM 2025 lift", "lift", S.psort, "n")}${th("BFCM TACoS", "tacos", S.psort, "n")}${th("Hero price cut 2025", "hkCut", S.psort, "n")}${th("Competitors", "nComp", S.psort, "n")}${th("With 2025 history", "nBf", S.psort, "n")}</tr></thead>
      <tbody>${sorter(rows, S.psort).map(r => `<tr class="click" data-key="${r.key}" tabindex="0">
        <td><div class="cellrow">${imgBox(r.img, "mini")}<div class="tt"><div class="t1">${esc(r.short)}</div><div class="t2">${esc(r.name)}</div></div></div></td>
        <td><span class="pill ${r.scope === "Core" ? "p-acc" : "p-neutral"}">${esc(r.scope)}</span></td>
        <td class="n">${money(r.price, r.mkt)}</td><td class="n">${int(r.u28)}</td><td class="n">${xf(r.lift)}</td>
        <td class="n">${isNum(r.tacos) ? r.tacos.toFixed(1) + "%" : "—"}</td><td class="n">${isNum(r.hkCut) ? pct(r.hkCut, 0) : "—"}</td>
        <td class="n">${int(r.nComp)}</td><td class="n">${int(r.nBf)}</td></tr>`).join("")}</tbody></table></div>
  </section>`;
}

/* ---------------- product ---------------- */
function product() {
  const p = P[S.key], m = p.mkt, cs = compsOf(p.key);
  const hk = p.hk;
  const tabs = [["summary", "Summary"], ["variations", `Variations (${p.vars.length})`], ["competitors", `Competitors (${cs.length})`], ["bfcm", "BFCM 2025"]];
  return `
  <section class="panel">
    <div class="ph">
      ${imgBox(p.img, "thumb", p.best)}
      <div style="min-width:0">
        <div class="eyebrow">${esc(p.brand)} · Amazon.${m === "CA" ? "ca" : "com"} · ${esc(p.role)} · ${esc(p.scope)}</div>
        <h1>${esc(p.title || p.name)}</h1>
        <div class="note" style="margin-top:4px">Parent ${link(p.parent, m)} · Best seller ${link(p.best, m)} · Stage ${esc(p.stage || "—")}</div>
        <div class="facts">
          <div class="fact"><div class="k">Our price, best child</div><div class="v">${money(p.price, m)}</div><div class="s">${esc(p.bestLabel)} · ${esc(p.priceSrc)}</div></div>
          <div class="fact"><div class="k">Units, last 28 days</div><div class="v">${int(p.u28)}</div><div class="s">${int(p.vars.length)} variations</div></div>
          <div class="fact"><div class="k">Contribution per unit</div><div class="v">${money(p.contrib, m)}</div><div class="s">break-even ACoS ${isNum(p.be) ? (p.be <= 1.5 ? pct(p.be, 1) : p.be.toFixed(1) + "%") : "—"}</div></div>
          <div class="fact"><div class="k">BFCM 2025 lift</div><div class="v">${xf(p.lift)}</div><div class="s">${isNum(p.tacos) ? `TACoS ${p.tacos.toFixed(1)}% vs ${isNum(p.preTacos) ? p.preTacos.toFixed(1) + "%" : "—"} before` : "no BFCM 2025 sales"}</div></div>

          <div class="fact"><div class="k">Competitors tracked</div><div class="v">${int(cs.length)}</div><div class="s">${int(cs.filter(c => c.bf_type).length)} with BFCM 2025 history</div></div>

}

function pSummary(p, cs) {

      ${p.stock ? `<div class="line"><div class="k">Stock</div><div>${esc(p.stock)}</div></div>` : ""}
      ${p.stockGap ? `<div class="line"><div class="k">Days with no stock reading</div><div>${esc(p.stockGap)}</div></div>` : ""}

function pVariations(p) {
  const m = p.mkt;
  let rows = p.vars;

  if (S.vcol) rows = rows.filter(v => v.colour === S.vcol);

  const nLive = p.vars.filter(v => v.live).length;

      <select id="vcol" aria-label="Colour"><option value="">All colours</option>${p.colours.map(s => `<option ${S.vcol === s.name ? "selected" : ""}>${esc(s.name)}</option>`).join("")}</select>

    </div>
    <div class="tw"><table>

        <td>${imgBox(v.img, "mini")}</td><td>${link(v.asin, m)}</td><td class="mono">${esc(v.sku || "—")}</td><td>${esc(v.size || "—")}</td><td>${esc(v.colour || "—")}</td>
        <td class="n">${v.live ? money(v.price, m) : '<span class="pill p-warn">no live price</span>'}</td><td class="note">${esc(v.src || (v.flag || ""))}</td>

}

function compRows(cs) {
  let rows = cs;
  if (S.ctier) rows = rows.filter(c => (c.tier || "Untiered") === S.ctier);
  if (S.cdeal) rows = rows.filter(c => (c.bf_type || "No history") === S.cdeal);
  if (S.cq) { const q = S.cq.toLowerCase(); rows = rows.filter(c => [c.brand, c.title, c.child, c.parent, c.colour, c.size].join(" ").toLowerCase().includes(q)); }
  return sorter(rows, S.csort);
}
function pCompetitors(p, cs) {
  const m = p.mkt, rows = compRows(cs);
  const tiers = [...new Set(cs.map(c => c.tier || "Untiered"))];
  const deals = [...new Set(cs.map(c => c.bf_type || "No history"))];
  return `<div class="toolbar">
      <div class="grow"><input type="search" id="cq" placeholder="Search brand, title, ASIN, size or colour" value="${esc(S.cq)}" aria-label="Search competitors"></div>
      <select id="ctier" aria-label="Tier"><option value="">All tiers</option>${tiers.map(t => `<option ${S.ctier === t ? "selected" : ""}>${esc(t)}</option>`).join("")}</select>
      <select id="cdeal" aria-label="BFCM 2025 deal"><option value="">All BFCM 2025 deals</option>${deals.map(t => `<option ${S.cdeal === t ? "selected" : ""}>${esc(t)}</option>`).join("")}</select>

        <td><div class="cellrow">${imgBox(c.img, "mini")}<div class="tt"><div class="t1">${esc(c.brand || "—")}</div><div class="t2">${esc(c.title || "")}</div><div class="faint mono" style="font-size:11px">${esc(c.child || "")}${c.size ? " · " + esc(c.size) : ""}${c.colour ? " · " + esc(c.colour) : ""}</div></div></div></td>
        <td>${tierPill(c.tier)}</td><td class="n">${money(c.price, m)}</td><td class="n">${money(c.lp, m)}</td>

        <td>${dealPill(c.bf_type)}${isNum(c.bf_disc_v) && c.bf_disc_v > 0 ? ` <span class="faint">−${pct(c.bf_disc_v, 0)}</span>` : ""}</td>
        <td class="n">${isNum(c.bsr_lift_v) ? `<span class="pill ${c.bsr_lift_v >= 1 ? "p-good" : "p-bad"}">${xf(c.bsr_lift_v)}</span>` : "—"}</td></tr>`).join("") || `<tr><td colspan="12" class="empty">No competitors match these filters.</td></tr>`}</tbody></table></div>`;
}

function pBfcm(p, cs) {
  const m = p.mkt;
  const by = {};
  cs.forEach(c => { if (!c.bf_type) return; (by[c.bf_type] = by[c.bf_type] || []).push(c); });
  const med = a => { const s = a.filter(isNum).sort((x, y) => x - y); if (!s.length) return null; const h = s.length >> 1; return s.length % 2 ? s[h] : (s[h - 1] + s[h]) / 2; };
  const rows = Object.entries(by).map(([t, a]) => ({t, n: a.length, disc: med(a.map(c => c.bf_disc_v)), lift: med(a.map(c => c.bsr_lift_v))})).sort((a, b) => b.n - a.n);
  const mx = Math.max(1, ...rows.map(r => r.lift || 0));
  return `<div class="panel-b" style="display:flex;flex-direction:column;gap:18px">
    <div class="grp"><h3>What competitors did in BFCM 2025 (Keepa, Nov 20 – Dec 1 vs Nov 1 – 19)</h3>
      ${rows.length ? `<div class="tw" style="max-height:none"><table><thead><tr><th>Deal type</th><th class="n">Competitors</th><th class="n">Median discount</th><th class="n">Median Best Seller Rank change</th><th style="width:40%">Rank change (1.00x = no change)</th></tr></thead><tbody>
      ${rows.map(r => `<tr><td>${dealPill(r.t)}</td><td class="n">${r.n}</td><td class="n">${isNum(r.disc) ? pct(r.disc, 0) : "—"}</td><td class="n">${xf(r.lift)}</td><td><div class="track"><span style="width:${isNum(r.lift) ? Math.round(100 * r.lift / mx) : 0}%"></span></div></td></tr>`).join("")}</tbody></table></div>`
      : `<div class="note">${m === "CA" ? "Canadian competitors' Keepa history is still being pulled." : "No BFCM 2025 history for these competitors."}</div>`}
      <div class="note" style="margin-top:8px">Rank change = median rank before ÷ median rank in BFCM week; above 1.00x means the rank improved. Discount = lowest effective price in BFCM week (Buy Box, Lightning Deal or Prime Exclusive) against the median before.</div>
    </div>
    <div class="grp"><h3>Our result</h3><div class="lines">
      <div class="line"><div class="k">Sales lift</div><div>${xf(p.lift)} daily sales in BFCM week vs the 30 days before (SellerBoard actual)</div></div>
      ${p.hkLine ? `<div class="line"><div class="k">Hero child</div><div>${esc(p.hkLine)}</div></div>` : ""}
      ${p.deals ? `<div class="line"><div class="k">Deals</div><div>${p.deals}</div></div>` : ""}
    </div></div>
  </div>`;
}

}

      <div class="grp"><h3>Reviews and listing</h3>${kv([

        ["Sponsored Products reach", pct(c.r_sp, 0)], ["Sponsored Brands reach", pct(c.r_sb, 0)], ["Brand video reach", pct(c.r_sbv, 0)], ["Amazon's Choice reach", pct(c.r_ac, 0)],

/* ---------------- render ---------------- */

  pick.value = S.key;
  const app = $("#app");
  app.innerHTML = S.view === "portfolio" ? portfolio() : S.view === "verify" ? verify() : product();
  if (S.view === "portfolio") {
    bindSort(app, "psort");
    ["US", "CA"].forEach(k => $("#pm-" + k).addEventListener("click", () => { S.pmkt = k; render(); }));
    app.querySelectorAll("tr[data-key]").forEach(tr => { const go = () => { S.key = tr.dataset.key; S.view = "product"; S.tab = "summary"; render(); window.scrollTo(0, 0); };
      tr.addEventListener("click", go); tr.addEventListener("keydown", e => { if (e.key === "Enter") go(); }); });
  }
  if (S.view === "product") {
    app.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => { S.tab = b.dataset.tab; render(); }));
    app.querySelectorAll("[data-colour]").forEach(b => b.addEventListener("click", () => { S.vcol = b.dataset.colour; S.vsize = null; S.tab = "variations"; render(); }));
    app.querySelectorAll("[data-size]").forEach(b => b.addEventListener("click", () => { S.vsize = b.dataset.size; S.vcol = null; S.tab = "variations"; render(); }));
    if (S.tab === "variations") {
      bindSort(app, "vsort");
      $("#vq").addEventListener("input", e => { S.vq = e.target.value; const pos = e.target.selectionStart; render(); const el = $("#vq"); el.focus(); el.setSelectionRange(pos, pos); });
      $("#vsize").addEventListener("change", e => { S.vsize = e.target.value || null; render(); });
      $("#vcol").addEventListener("change", e => { S.vcol = e.target.value || null; render(); });
    }
    if (S.tab === "competitors") {
      bindSort(app, "csort");
      $("#cq").addEventListener("input", e => { S.cq = e.target.value; const pos = e.target.selectionStart; render(); const el = $("#cq"); el.focus(); el.setSelectionRange(pos, pos); });
      $("#ctier").addEventListener("change", e => { S.ctier = e.target.value; render(); });
      $("#cdeal").addEventListener("change", e => { S.cdeal = e.target.value; render(); });
      app.querySelectorAll("tr[data-cid]").forEach(tr => { const go = () => openComp(tr.dataset.cid); tr.addEventListener("click", go); tr.addEventListener("keydown", e => { if (e.key === "Enter") go(); }); });
    }
  }
}
render();
</script>
